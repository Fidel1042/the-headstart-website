[build]
  functions = "netlify/functions"
  publish = "."

[functions]
  node_bundler = "esbuild"

# Private lead magnet PDFs. Random filenames only, never linked from the site.
# Tell search engines not to index or archive them even if a link leaks.
[[headers]]
  for = "/guides/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"

# The URLs stay random so they cannot be guessed, but these give each file a
# human name, so it opens as "Stage 1" and saves as "Stage 1.pdf" rather than
# as the random string. Keep in sync with Lead Magnet/LINKS.md when rotating.
[[headers]]
  for = "/guides/4ec5108ee6d094cd73a65ddb.pdf"
  [headers.values]
    Content-Disposition = 'inline; filename="Stage 1.pdf"'

[[headers]]
  for = "/guides/2dfc6f2dccc42a5f07dabfb0.pdf"
  [headers.values]
    Content-Disposition = 'inline; filename="Stage 2.pdf"'

[[headers]]
  for = "/guides/8b16d7c5beb2e0c528e8b563.pdf"
  [headers.values]
    Content-Disposition = 'inline; filename="Stage 3.pdf"'

[[headers]]
  for = "/guides/4864dbf7f4521178ced29d1e.pdf"
  [headers.values]
    Content-Disposition = 'inline; filename="Stage 4.pdf"'

# The t+90 consultation check-in, Mondays at 2pm Melbourne. Both hours are
# scheduled because Netlify cron is UTC and Melbourne moves with daylight
# saving; the function itself checks the local clock and only sends on one.
[functions."checkin-sender"]
  schedule = "0 3,4 * * 1"

# Copies Brevo email stats into the Airtable "Email Stats" table, one row per
# email per week. Brevo only answers 90 days; Airtable keeps it forever, so a
# full-year view builds itself. Runs daily rather than weekly because opens
# keep arriving for days after a send and each run rewrites the whole window,
# so a week keeps correcting itself until it ages out of Brevo's reach.
# Upserts on a "week|email" key, so running it twice changes nothing.
[functions."email-snapshot"]
  schedule = "23 17 * * *"

[functions."monthly-pl"]
  schedule = "0 0 1 * *"

# Tuesday morning leads report, 06:15 Sydney all year round.
# Netlify crons run in UTC, and Sydney shifts between UTC+10 and UTC+11 with
# daylight saving. Firing at both 19:15 and 20:15 UTC on Monday means one of
# them always lands on 06:15 Tuesday in Sydney; the function checks the local
# hour and exits quietly on the other. Do not "tidy" this into a single time.
# Moved off Monday 4 Sep 2026 at Fidel's request.
[functions."weekly-report"]
  schedule = "15 19,20 * * 1"

# Dated one-off reminders (see the REMINDERS list in reminders.js).
# Fires daily at both 23:00 and 00:00 UTC so one of them is always 10:00 in
# Sydney across daylight saving (AEST is UTC+10, AEDT UTC+11); the function
# checks the local date and hour and no-ops unless a reminder is due that day.
[functions."reminders"]
  schedule = "0 23,0 * * *"

# Mentor reminders. Runs hourly at :00 and :15; the function only sends at the
# right Melbourne local time (weekdays 5:15pm, weekends 10am) and exits fast
# otherwise. Hourly is needed so it stays correct across daylight saving.
[functions."session-reminders"]
  schedule = "0,15 * * * *"

# Lead pipeline watchdog. Every 2 hours, and it only sends an email when
# something is actually broken, so silence means the chain is healthy.
# Two-hourly rather than hourly because the thing it catches is an outage that
# costs leads, and a repeat every two hours until it is fixed is about right.
[functions."pipeline-watchdog"]
  schedule = "40 */2 * * *"

# Declined-card chase list. Runs hourly on the hour; the function itself only
# sends in the Melbourne 9am window, so a failure from yesterday's 5:15pm
# charge run reaches Fidel first thing the next morning.
[functions."payment-reminders"]
  schedule = "0 * * * *"

# Unconfirmed interviews. Runs hourly and looks at the hour-wide slice that is
# five hours away, so each interview is considered exactly once. UTC is fine
# here because the window is relative to now, not to a wall-clock time, so
# daylight saving cannot shift it. "Interview Chased" is stamped after the
# email, which makes a double send impossible.
[functions."interview-chase"]
  schedule = "7 * * * *"
