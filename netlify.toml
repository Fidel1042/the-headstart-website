[build]
  functions = "netlify/functions"
  publish = "."

[functions]
  node_bundler = "esbuild"

# Private lead magnet PDFs. Random filenames only, never linked from the site.
# Tell search engines not to index or archive them even if a link leaks.
[[headers]]
  for = "/guides/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"

# The URLs stay random so they cannot be guessed, but these give each file a
# human name, so it opens as "Stage 1" and saves as "Stage 1.pdf" rather than
# as the random string. Keep in sync with Lead Magnet/LINKS.md when rotating.
[[headers]]
  for = "/guides/4ec5108ee6d094cd73a65ddb.pdf"
  [headers.values]
    Content-Disposition = 'inline; filename="Stage 1.pdf"'

[[headers]]
  for = "/guides/2dfc6f2dccc42a5f07dabfb0.pdf"
  [headers.values]
    Content-Disposition = 'inline; filename="Stage 2.pdf"'

[[headers]]
  for = "/guides/8b16d7c5beb2e0c528e8b563.pdf"
  [headers.values]
    Content-Disposition = 'inline; filename="Stage 3.pdf"'

[[headers]]
  for = "/guides/4864dbf7f4521178ced29d1e.pdf"
  [headers.values]
    Content-Disposition = 'inline; filename="Stage 4.pdf"'

[functions."monthly-pl"]
  schedule = "0 0 1 * *"

# Monday morning leads report, 06:15 Sydney all year round.
# Netlify crons run in UTC, and Sydney shifts between UTC+10 and UTC+11 with
# daylight saving. Firing at both 19:15 and 20:15 UTC on Sunday means one of
# them always lands on 06:15 in Sydney; the function checks the local hour and
# exits quietly on the other. Do not "tidy" this into a single time.
[functions."weekly-report"]
  schedule = "15 19,20 * * 0"

# Mentor reminders. Runs hourly at :00 and :15; the function only sends at the
# right Melbourne local time (weekdays 5:15pm, weekends 10am) and exits fast
# otherwise. Hourly is needed so it stays correct across daylight saving.
[functions."session-reminders"]
  schedule = "0,15 * * * *"

# Declined-card chase list. Runs hourly on the hour; the function itself only
# sends in the Melbourne 9am window, so a failure from yesterday's 5:15pm
# charge run reaches Fidel first thing the next morning.
[functions."payment-reminders"]
  schedule = "0 * * * *"
