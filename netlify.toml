[build]
  functions = "netlify/functions"
  publish = "."

[functions]
  node_bundler = "esbuild"

# Private lead magnet PDFs. Random filenames only, never linked from the site.
# Tell search engines not to index or archive them even if a link leaks.
[[headers]]
  for = "/guides/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"
    Content-Disposition = "inline"

[functions."monthly-pl"]
  schedule = "0 0 1 * *"

# Mentor reminders. Runs hourly at :00 and :15; the function only sends at the
# right Melbourne local time (weekdays 5:15pm, weekends 10am) and exits fast
# otherwise. Hourly is needed so it stays correct across daylight saving.
[functions."session-reminders"]
  schedule = "0,15 * * * *"
