<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <title>Weekly Payslips – The Headstart</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
  <style id="auth-gate">html:not(.auth-ok) body { visibility: hidden; }</style>
  <script type="module">
    import { requireAuth } from "./auth.js";
    import { mountPortalNav, initTheme } from "./portal-ui.js";

    initTheme();

    requireAuth((session) => {
      const email = session?.user?.email || "";
      const OWNERS = ["fidelhon@gmail.com", "kokoro.araki1015@gmail.com"];
      if (!OWNERS.includes(email) && email !== "dev@localhost") {
        window.location.replace("/mentor-portal/index.html");
        return;
      }
      mountPortalNav({ email, isOwner: true, active: "payslips" });
      loadPayslips();
    });

    function formatDate(dateStr) {
      if (!dateStr) return "—";
      const d = new Date(dateStr.slice(0, 10) + "T00:00:00");
      return d.toLocaleDateString("en-AU", { day: "numeric", month: "short", year: "numeric" });
    }

    async function loadPayslips() {
      const loading  = document.getElementById("loading");
      const empty    = document.getElementById("empty");
      const content  = document.getElementById("content");
      const weekEl   = document.getElementById("week-label");
      const list     = document.getElementById("mentor-list");
      const totalEl  = document.getElementById("grand-total");
      const sendBtn  = document.getElementById("send-btn");

      loading.hidden = false;

      let data;

      if (location.hostname === "localhost" || location.hostname === "127.0.0.1") {
        // Mock data for local preview
        data = {
          weekLabel: "9 Jun – 15 Jun 2026",
          mentors: [
            {
              email: "angelicagrace160272@gmail.com",
              name: "Angelica",
              total: 110,
              sessions: [
                { date: "2026-06-10", mentee: "Priya Sharma", payout: 55 },
                { date: "2026-06-13", mentee: "Yuki Tanaka",  payout: 55 },
              ],
            },
            {
              email: "aidanmwibrata@gmail.com",
              name: "Aidan",
              total: 60,
              sessions: [
                { date: "2026-06-09", mentee: "Saksha Patel",  payout: 20 },
                { date: "2026-06-11", mentee: "James Liu",     payout: 20 },
                { date: "2026-06-14", mentee: "Maria Santos",  payout: 20 },
              ],
            },
            {
              email: "wooheehan3@gmail.com",
              name: "Woo Hee",
              total: 50,
              sessions: [
                { date: "2026-06-12", mentee: "Chen Wei", payout: 50 },
              ],
            },
          ],
        };
      } else {
        try {
          const res = await fetch("/.netlify/functions/get-payslips", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({}),
          });
          data = await res.json();
        } catch {
          loading.hidden = true;
          empty.textContent = "Could not load — refresh to try again.";
          empty.hidden = false;
          return;
        }
      }

      loading.hidden = true;

      if (!data.mentors || data.mentors.length === 0) {
        empty.hidden = false;
        return;
      }

      weekEl.textContent = data.weekLabel;

      let grandTotal = 0;
      list.innerHTML = data.mentors.map((m) => {
        grandTotal += m.total;
        const rows = m.sessions.map((s) => `
          <div class="session-row">
            <span class="session-date">${formatDate(s.date)}</span>
            <span class="session-mentee">${s.mentee}</span>
            <span class="session-amount">$${s.payout.toFixed(2)}</span>
          </div>`).join("");

        return `
          <div class="mentor-card">
            <div class="mentor-header">
              <span class="mentor-name">${m.name}</span>
              <span class="mentor-total">$${m.total.toFixed(2)} AUD</span>
            </div>
            <div class="mentor-email">${m.email}</div>
            <div class="sessions">${rows}</div>
          </div>`;
      }).join("");

      totalEl.textContent = `$${grandTotal.toFixed(2)} AUD`;
      content.hidden = false;
      sendBtn.hidden = false;
    }

    window.sendAll = async function(btn) {
      if (!confirm("Send payslip emails to all mentors listed?")) return;
      const original = btn.textContent;
      btn.disabled = true;
      btn.textContent = "Sending…";
      try {
        const res  = await fetch("/.netlify/functions/send-payslips", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({}),
        });
        const data = await res.json();
        if (data.sent) {
          const count = data.sent.filter((r) => r.success).length;
          btn.textContent = `Sent to ${count} mentor${count !== 1 ? "s" : ""} ✓`;
          btn.classList.add("sent");
        } else {
          btn.textContent = data.message || "Nothing to send";
        }
      } catch {
        btn.textContent = "Failed — try again";
        btn.disabled = false;
      }
    };
  </script>
  <style>
    :root {
      --bg: #000;
      --bg-card: rgba(255,255,255,0.04);
      --text: #fff;
      --text-muted: rgba(255,255,255,0.45);
      --line: rgba(255,255,255,0.1);
      --accent: #c79b3b;
      --accent-bright: #f0c75c;
      --gold-gradient: linear-gradient(90deg, #fdf5c4 0%, #f7d37d 35%, #c08a2d 68%, #ffeb9f 100%);
      --shadow-card: 0 12px 32px rgba(0,0,0,0.4);
    }
    [data-theme="light"] {
      --bg: #fff;
      --bg-card: rgba(0,0,0,0.025);
      --text: #000;
      --text-muted: rgba(0,0,0,0.4);
      --line: rgba(0,0,0,0.1);
      --accent: #a07a1d;
      --accent-bright: #c79b3b;
      --gold-gradient: linear-gradient(90deg, #8a6210 0%, #b88820 35%, #a07a1d 68%, #c79b3b 100%);
      --shadow-card: 0 6px 18px rgba(0,0,0,0.08);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 110%; }
    @media (max-width: 700px) { html { font-size: 95%; } }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    [hidden] { display: none !important; }

    /* Nav chrome is shared — injected by portal-ui.js, styled by portal.css. */

    /* ── Page ── */
    .page {
      max-width: 640px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }

    .page-header {
      margin-bottom: 32px;
    }
    .page-title {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text);
      margin-bottom: 6px;
    }
    .week-label {
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    /* ── Mentor cards ── */
    .mentor-list { display: flex; flex-direction: column; gap: 16px; }

    .mentor-card {
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 20px 24px;
    }
    .mentor-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 4px;
    }
    .mentor-name {
      font-size: 1rem;
      font-weight: 700;
    }
    .mentor-total {
      font-size: 1rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--accent-bright);
    }
    .mentor-email {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    .sessions { display: flex; flex-direction: column; gap: 2px; }
    .session-row {
      display: grid;
      grid-template-columns: 110px 1fr auto;
      gap: 12px;
      padding: 6px 0;
      border-top: 1px solid var(--line);
      font-size: 0.88rem;
    }
    .session-date { color: var(--text-muted); }
    .session-mentee { color: var(--text); }
    .session-amount { font-variant-numeric: tabular-nums; color: var(--text); }

    /* ── Footer ── */
    .footer-bar {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .grand-total-label { font-size: 0.88rem; color: var(--text-muted); }
    .grand-total-value {
      font-size: 1.2rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .send-btn {
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 10px;
      padding: 12px 28px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s, opacity 0.15s;
    }
    .send-btn:hover { background: var(--accent-bright); }
    .send-btn:disabled { opacity: 0.6; cursor: default; }
    .send-btn.sent { background: #4caf81; color: #fff; }

    .loading, .empty {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      padding: 60px 0;
    }
  </style>
  <link rel="stylesheet" href="portal.css" />
</head>
<body>

  <div id="portal-nav"></div>

  <main class="page">

    <div class="page-header">
      <p class="page-title">Weekly Payslips</p>
      <p class="week-label" id="week-label"></p>
    </div>

    <p class="loading" id="loading" hidden>Loading…</p>
    <p class="empty" id="empty" hidden>No unpaid sessions outstanding.</p>

    <div id="content" hidden>
      <div class="mentor-list" id="mentor-list"></div>

      <div class="footer-bar">
        <div>
          <p class="grand-total-label">Total payout this week</p>
          <p class="grand-total-value" id="grand-total"></p>
        </div>
        <button class="send-btn" id="send-btn" hidden onclick="sendAll(this)">Send payslip emails</button>
      </div>
    </div>

  </main>

</body>
</html>
