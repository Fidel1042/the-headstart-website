<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <title>My Stats – The Headstart</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
  <style id="auth-gate">
    html:not(.auth-ok) body { visibility: hidden; }
    html:not(.auth-ok) { background: #fff; }
  </style>
  <link rel="stylesheet" href="portal.css" />
  <link rel="stylesheet" href="portal-nav.css" />
  <link rel="stylesheet" href="/mentor-portal/polish.css" />
  <style>
    .stats-page { max-width: 940px; margin: 0 auto; padding: 1.6rem 1.2rem 4rem; }
    .stats-head { margin-bottom: 1.6rem; }
    .stats-head h1 { font-size: 1.4rem; font-weight: 800; margin: 0 0 0.2rem; }
    .stats-head p { font-size: 0.85rem; color: var(--text-muted); margin: 0; }

    /* ── Headline tiles ── */
    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.8rem; margin-bottom: 1.6rem; }
    .tile {
      border: 1px solid var(--line); border-radius: 14px;
      padding: 1rem 1.1rem; background: var(--bg-card);
      display: flex; flex-direction: column; gap: 0.15rem;
    }
    .tile__label {
      font-size: 0.62rem; font-weight: 800; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--accent);
    }
    .tile__val { font-size: 1.7rem; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .tile__sub { font-size: 0.74rem; color: var(--text-muted); }

    /* ── Chart ── */
    .chart-card { border: 1px solid var(--line); border-radius: 16px; padding: 1.3rem 1.4rem; background: var(--bg-card); margin-bottom: 1.4rem; }
    .chart-tabs { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 1.3rem; }
    .chart-tab {
      font-family: inherit; font-size: 0.74rem; font-weight: 700;
      padding: 0.35rem 0.85rem; border-radius: 999px; cursor: pointer;
      border: 1px solid var(--line); background: transparent; color: var(--text-muted);
    }
    .chart-tab.is-on { border-color: var(--accent-line); background: var(--accent-soft); color: var(--accent); }

    .bars { display: flex; align-items: flex-end; gap: 0.6rem; height: 190px; }
    .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 0.4rem; height: 100%; justify-content: flex-end; }
    .bar-val { font-size: 0.74rem; font-weight: 800; font-variant-numeric: tabular-nums; }
    .bar {
      width: 100%; max-width: 54px; border-radius: 8px 8px 3px 3px;
      background: linear-gradient(180deg, var(--accent) 0%, rgba(155,111,22,0.55) 100%);
      min-height: 3px; transition: height 0.35s ease, opacity 0.15s;
    }
    .bar-col:hover .bar { opacity: 0.82; }
    .bar-col--now .bar { background: linear-gradient(180deg, #d6a93e 0%, var(--accent) 100%); }
    .bar-label { font-size: 0.66rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .bar-col--now .bar-label { color: var(--accent); font-weight: 800; }

    /* ── Cadence ── */
    .cadence { border: 1px solid var(--line); border-radius: 16px; padding: 1.3rem 1.4rem; background: var(--bg-card); }
    .cadence__row { display: flex; align-items: baseline; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 0.9rem; }
    .cadence__big { font-size: 2.1rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
    .cadence__unit { font-size: 0.85rem; color: var(--text-muted); }
    .track { position: relative; height: 12px; border-radius: 999px; background: rgba(0,0,0,0.07); overflow: visible; margin: 1.4rem 0 0.5rem; }
    .track__fill { height: 100%; border-radius: 999px; background: var(--accent); transition: width 0.5s ease; }
    .track__mark { position: absolute; top: -7px; width: 2px; height: 26px; background: #4caf81; }
    .track__mark span {
      position: absolute; top: -20px; left: 50%; transform: translateX(-50%);
      font-size: 0.62rem; font-weight: 800; color: #4caf81; white-space: nowrap;
    }
    .track-ends { display: flex; justify-content: space-between; font-size: 0.66rem; color: var(--text-muted); }
    .cadence__note { font-size: 0.85rem; color: var(--text); margin-top: 1.1rem; line-height: 1.6; }
    .cadence__note strong { color: var(--accent); }
    /* Per mentee: the target turned into a list of names to act on. */
    .hint { font-size: 0.82rem; color: var(--text-muted); margin: 0.4rem 0 1.1rem; }
    .mrow {
      display: grid; grid-template-columns: 1fr 78px 1fr 96px;
      align-items: center; gap: 0.8rem;
      padding: 0.65rem 0; border-top: 1px solid var(--line-soft);
      font-size: 0.86rem;
    }
    .mrow:first-child { border-top: none; }
    .mrow__name { font-weight: 700; }
    .mrow__gap { font-weight: 800; font-variant-numeric: tabular-nums; text-align: right; }
    .mrow__bar { height: 8px; border-radius: 999px; background: rgba(0,0,0,0.07); overflow: hidden; }
    .mrow__fill { height: 100%; border-radius: 999px; background: var(--accent); }
    .mrow--good .mrow__fill { background: #4caf81; }
    .mrow--good .mrow__gap { color: #4caf81; }
    .mrow__since { font-size: 0.74rem; color: var(--text-muted); text-align: right; }
    .mrow__since.is-late { color: #e05050; font-weight: 700; }
    @media (max-width: 620px) {
      .mrow { grid-template-columns: 1fr auto; }
      .mrow__bar { display: none; }
    }

    .state { font-size: 0.9rem; color: var(--text-muted); padding: 2rem 0; text-align: center; }
  </style>
</head>
<body>

  <div id="portal-nav"></div>

  <main class="stats-page">
    <div class="stats-head">
      <h1>My stats</h1>
      <p>Your last 6 months. Only you and the Headstart team can see this.</p>
    </div>

    <p class="state" id="loading">Loading&hellip;</p>
    <p class="state" id="error" hidden></p>

    <div id="content" hidden>
      <div class="tiles" id="tiles"></div>

      <div class="chart-card">
        <div class="chart-tabs" id="chart-tabs">
          <button type="button" class="chart-tab is-on" data-metric="earnings">Earnings</button>
          <button type="button" class="chart-tab" data-metric="sessions">Sessions</button>
          <button type="button" class="chart-tab" data-metric="perStudent">Sessions per student</button>
        </div>
        <div class="bars" id="bars"></div>
      </div>

      <div class="cadence" id="cadence"></div>

      <div class="chart-card" id="per-mentee-card" hidden>
        <span class="tile__label">Where the next sessions are</span>
        <p class="hint" id="per-mentee-hint"></p>
        <div id="per-mentee"></div>
      </div>
    </div>
  </main>

  <script type="module">
    import { requireAuth } from "./auth.js";
    import { mountPortalNav, initTheme } from "./portal-ui.js";

    initTheme();

    const isLocal = location.hostname === "localhost" || location.hostname === "127.0.0.1";
    let DATA = null;
    let METRIC = "earnings";

    const money = (n) => "$" + Math.round(n).toLocaleString("en-AU");
    const monthLabel = (k) =>
      new Date(k + "-01T00:00:00").toLocaleDateString("en-AU", { month: "short" });

    requireAuth(async (session) => {
      const loginEmail = session?.user?.email || "";
      const OWNERS = ["fidelhon@gmail.com", "kokoro.araki1015@gmail.com"];
      const isOwner = OWNERS.includes(loginEmail) || loginEmail === "dev@localhost";
      // Owners can look at any mentor's dashboard with ?as=, the same way the
      // rest of the portal works.
      const asParam = (new URLSearchParams(location.search).get("as") || "").toLowerCase().trim();
      const mentorEmail = (isOwner && asParam) ? asParam : loginEmail;

      mountPortalNav({ email: mentorEmail, isOwner, active: "stats", loginEmail });
      load(mentorEmail);
    });

    async function load(mentorEmail) {
      const loading = document.getElementById("loading");
      const errorEl = document.getElementById("error");
      try {
        if (isLocal) {
          DATA = {
            months: [
              { month: "2026-03", sessions: 2, earnings: 40, mentees: 2, perStudent: 1 },
              { month: "2026-04", sessions: 5, earnings: 100, mentees: 3, perStudent: 1.7 },
              { month: "2026-05", sessions: 4, earnings: 80, mentees: 3, perStudent: 1.3 },
              { month: "2026-06", sessions: 9, earnings: 180, mentees: 4, perStudent: 2.3 },
              { month: "2026-07", sessions: 14, earnings: 280, mentees: 5, perStudent: 2.8 },
              { month: "2026-08", sessions: 6, earnings: 120, mentees: 4, perStudent: 1.5 },
            ],
            totals: { sessions: 40, earnings: 800 },
            gap: 9.4, allMentorGap: 10.7, targetGap: 7,
            mentees: [
              { name: "Vikrant Date", sessions: 3, gap: 15, last: "2026-07-29", since: 16 },
              { name: "Nikhil Gupta", sessions: 4, gap: 9,  last: "2026-08-05", since: 9 },
              { name: "Ahmed Ali",    sessions: 3, gap: 4,  last: "2026-08-12", since: 2 },
            ],
            upside: { extraSessions: 19, extraEarnings: 380 },
          };
        } else {
          const res = await fetch("/.netlify/functions/mentor-stats", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ mentorEmail }),
          });
          DATA = await res.json();
          if (!res.ok) throw new Error(DATA.error || "Could not load");
        }
      } catch (err) {
        loading.hidden = true;
        errorEl.textContent = err.message || "Could not load — refresh to try again.";
        errorEl.hidden = false;
        return;
      }
      loading.hidden = true;
      render();
      document.getElementById("content").hidden = false;
    }

    function render() {
      const now = DATA.months[DATA.months.length - 1];
      const prev = DATA.months[DATA.months.length - 2] || { sessions: 0, earnings: 0 };
      // Month on month, stated plainly. A mentor should not have to work out
      // whether they are up or down.
      const delta = (a, b, fmt) => {
        if (!b) return a ? "first month with any" : "";
        const pct = Math.round(((a - b) / b) * 100);
        return `${pct >= 0 ? "up" : "down"} ${Math.abs(pct)}% on last month`;
      };

      document.getElementById("tiles").innerHTML = [
        ["This month", money(now.earnings), delta(now.earnings, prev.earnings)],
        ["Sessions", String(now.sessions), delta(now.sessions, prev.sessions)],
        ["Mentees seen", String(now.mentees), `${now.perStudent} each on average`],
        ["Last 6 months", money(DATA.totals.earnings), `${DATA.totals.sessions} sessions`],
      ].map(([l, v, s]) => `
        <div class="tile">
          <span class="tile__label">${l}</span>
          <span class="tile__val">${v}</span>
          <span class="tile__sub">${s}</span>
        </div>`).join("");

      drawBars();
      drawCadence();
      drawMentees();
    }

    // The cadence number on its own changes nothing. This turns it into a list
    // of names, worst first, with how long since each was last seen.
    function drawMentees() {
      const list = (DATA.mentees || []).filter((m) => m.sessions > 0);
      const card = document.getElementById("per-mentee-card");
      if (!list.length) { card.hidden = true; return; }
      const target = DATA.targetGap;
      const worst = Math.max(...list.map((m) => m.gap || target), target);

      document.getElementById("per-mentee-hint").textContent =
        "Your mentees, longest gap first. The one at the top is where your next session is.";

      document.getElementById("per-mentee").innerHTML = list.map((m) => {
        const gap = m.gap;
        const good = gap !== null && gap <= target;
        // Bar fills toward the target: full means at or better than target.
        const pct = gap === null ? 0 : Math.max(6, Math.min(100, Math.round((target / gap) * 100)));
        const late = m.since > target * 1.5;
        return `
          <div class="mrow${good ? " mrow--good" : ""}">
            <span class="mrow__name">${esc(m.name)}</span>
            <span class="mrow__gap">${gap === null ? "&mdash;" : gap + "d"}</span>
            <span class="mrow__bar"><span class="mrow__fill" style="width:${pct}%"></span></span>
            <span class="mrow__since${late ? " is-late" : ""}">${m.since}d ago</span>
          </div>`;
      }).join("");
      card.hidden = false;
    }

    const esc = (v) => String(v == null ? "" : v)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

    function drawBars() {
      const vals = DATA.months.map((m) => m[METRIC]);
      const max = Math.max(...vals, 1);
      const fmt = (v) => METRIC === "earnings" ? money(v) : String(v);
      document.getElementById("bars").innerHTML = DATA.months.map((m, i) => {
        const h = Math.round((m[METRIC] / max) * 100);
        const isNow = i === DATA.months.length - 1;
        return `
          <div class="bar-col${isNow ? " bar-col--now" : ""}" title="${monthLabel(m.month)}: ${fmt(m[METRIC])}">
            <span class="bar-val">${m[METRIC] ? fmt(m[METRIC]) : ""}</span>
            <div class="bar" style="height:${Math.max(h, m[METRIC] ? 4 : 0)}%"></div>
            <span class="bar-label">${monthLabel(m.month)}</span>
          </div>`;
      }).join("");
    }

    function drawCadence() {
      const gap = DATA.gap;
      const target = DATA.targetGap;
      const box = document.getElementById("cadence");
      if (gap === null || gap === undefined) {
        box.innerHTML = `<span class="tile__label">Your cadence</span>
          <p class="cadence__note">Log a couple more sessions with the same mentee and this will show how often you are seeing them.</p>`;
        return;
      }
      // Shorter is better, so the bar fills as the gap approaches the target.
      const pct = Math.max(6, Math.min(100, Math.round((target / gap) * 100)));
      const up = DATA.upside;

      box.innerHTML = `
        <span class="tile__label">Your cadence</span>
        <div class="cadence__row">
          <span class="cadence__big">${gap}</span>
          <span class="cadence__unit">days between each mentee's sessions</span>
        </div>
        <div class="track">
          <div class="track__fill" style="width:${pct}%"></div>
          <div class="track__mark" style="left:100%"><span>target ${target}d</span></div>
        </div>
        <div class="track-ends"><span>You: ${gap} days</span><span>Target: ${target} days</span></div>
        <p class="cadence__note">
          ${gap <= target
            ? `You are at the target. This is the number that separates a good month from a quiet one.`
            : `Seeing each mentee every <strong>${target} days</strong> instead of ${gap} is the single biggest lever on what you earn.` +
              (up ? ` At that pace this month you would be on <strong>${up.extraSessions} more sessions</strong>, about <strong>${money(up.extraEarnings)}</strong>.` : "")}
        </p>`;
    }

    document.getElementById("chart-tabs").addEventListener("click", (e) => {
      const tab = e.target.closest(".chart-tab");
      if (!tab) return;
      METRIC = tab.dataset.metric;
      document.querySelectorAll(".chart-tab").forEach((t) => t.classList.toggle("is-on", t === tab));
      drawBars();
    });
  </script>
</body>
</html>
