<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <title>Mentor Portal – The Headstart</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <link rel="manifest" href="/mentor-portal/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/mentor-portal/icons/icon-180.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Headstart" />
  <meta name="format-detection" content="telephone=no" />
  <script defer src="/mentor-portal/pwa.js"></script>
  <meta name="description" content="Private mentor portal for The Headstart mentoring platform." />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <style id="auth-gate">
    html:not(.auth-ok) body { visibility: hidden; }
    html:not(.auth-ok) { background: #000; }
    html:not(.auth-ok)::after {
      content: ""; position: fixed; top: 50%; left: 50%;
      width: 30px; height: 30px; margin: -15px 0 0 -15px;
      border-radius: 50%; border: 3px solid rgba(255,255,255,0.18);
      border-top-color: #c79b3b; animation: auth-spin 0.7s linear infinite;
    }
    @keyframes auth-spin { to { transform: rotate(360deg); } }
  </style>
  <script>
    /* Failsafe: if the login check has not finished in 12s (e.g. the auth
       library failed to load on a weak connection) swap the blank screen for
       a reload prompt so nobody is ever stuck on a black screen. */
    setTimeout(function () {
      var r = document.documentElement;
      if (!r.classList.contains("auth-ok")) {
        r.classList.add("auth-ok");
        if (document.body) document.body.innerHTML =
          '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;background:#000;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif">' +
          '<p style="font-size:1.05rem;max-width:340px;line-height:1.5">This page is taking too long to load. Check your internet, then reload.</p>' +
          '<button onclick="location.reload()" style="padding:12px 26px;border-radius:999px;border:1px solid #c79b3b;background:transparent;color:#f0c75c;font-weight:700;font-size:0.9rem;cursor:pointer">Reload</button>' +
          '</div>';
      }
    }, 12000);
  </script>
  <script type="module">
    import { requireAuth, ALLOWED_MENTOR_EMAILS } from "./auth.js";
    import { mountPortalNav, initTheme } from "./portal-ui.js";
    import { renderMenteeDashboard } from "./mentee-dashboard.js";
    import { renderSessionHistory } from "./session-history.js";

    initTheme();

    // Dashboard state: render once both mentees + sessions have arrived,
    // re-render whenever the session history refreshes. Declared before
    // requireAuth because its callback fires synchronously on localhost.
    const dash = { mentees: null, sessions: null, mentorEmail: "" };
    function refreshDashboard() {
      if (dash.mentees && dash.sessions) {
        renderMenteeDashboard({ mentees: dash.mentees, sessions: dash.sessions, mentorEmail: dash.mentorEmail });
      }
    }

    requireAuth((session) => {
      const loginEmail = session?.user?.email || "";
      const OWNERS = ["fidelhon@gmail.com", "kokoro.araki1015@gmail.com"];
      const isOwner = OWNERS.includes(loginEmail) || loginEmail === "dev@localhost";

      // Owner impersonation: ?as=mentor@email loads the portal exactly as that
      // mentor sees it (for troubleshooting). Ignored for non-owners.
      const asParam = (new URLSearchParams(location.search).get("as") || "").toLowerCase().trim();
      const mentorEmail = (isOwner && asParam) ? asParam : loginEmail;

      mountPortalNav({
        email: (isOwner && asParam) ? `viewing as ${mentorEmail}` : mentorEmail,
        isOwner,
        active: "home",
      });

      if (isOwner) {
        // Build the "View as mentor" dropdown (injected by mountPortalNav).
        const viewAs = document.getElementById("view-as");
        if (viewAs) {
          const opts = ['<option value="">View as… (yourself)</option>']
            .concat(ALLOWED_MENTOR_EMAILS
              .filter((e) => !OWNERS.includes(e))
              .map((e) => `<option value="${e}"${e === asParam ? " selected" : ""}>${e}</option>`));
          viewAs.innerHTML = opts.join("");
          viewAs.style.display = "";
          viewAs.addEventListener("change", () => {
            const val = viewAs.value;
            location.search = val ? `?as=${encodeURIComponent(val)}` : "";
          });
        }
      }

      initSessionForm(mentorEmail);
    });

    async function initSessionForm(mentorEmail) {
      dash.mentorEmail = mentorEmail;
      const menteeSelect     = document.getElementById("mentee-select");
      const dateInput        = document.getElementById("session-date");
      const nextDateInput    = document.getElementById("next-session-date");
      const notesField       = document.getElementById("session-notes");
      const submitBtn     = document.getElementById("session-submit-btn");
      const errorEl       = document.getElementById("form-error");
      const logCard       = document.getElementById("log-card");
      const successCard   = document.getElementById("success-card");
      const successDetail = document.getElementById("success-detail");

      // Default date = today in local timezone
      if (dateInput) {
        const now   = new Date();
        const local = new Date(now.getTime() - now.getTimezoneOffset() * 60000);
        dateInput.value = local.toISOString().split("T")[0];
      }

      // Load mentees assigned to this mentor
      const isLocal = location.hostname === "localhost" || location.hostname === "127.0.0.1";
      try {
        let data;
        if (isLocal) {
          // Mock data so the portal can be demoed / troubleshot without live functions.
          data = { mentees: [
            { id: "recMOCK1", name: "Mary Chen",    billingType: "Per Session", hasCard: true,  industry: "Consulting", major: "Commerce",  year: "Final year", plan: "Direction, then Foundation", notes: "" },
            { id: "recMOCK2", name: "Priya Sharma", billingType: "Per Session", hasCard: false, industry: "Tech",       major: "IT",        year: "2nd year",   plan: "", notes: "Prefers evening sessions" },
            { id: "recMOCK3", name: "Chen Wei",     billingType: "Package",     hasCard: true,  industry: "Accounting", major: "Accounting", year: "Graduate",  plan: "First Rounds into Final Boss", notes: "" },
          ] };
        } else {
          const res = await fetch("/.netlify/functions/get-mentees", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ mentorEmail }),
          });
          data = await res.json();
        }
        if (!data.mentees || data.mentees.length === 0) {
          menteeSelect.innerHTML = '<option value="">No mentees assigned yet</option>';
        } else {
          menteeSelect.innerHTML = data.mentees
            .map((m) => {
              const noCard = m.hasCard === false && m.billingType !== "Package";
              return `<option value="${m.id}">${m.name}${noCard ? " — no card on file" : ""}</option>`;
            })
            .join("");
        }
        dash.mentees = data.mentees || [];
        refreshDashboard();
      } catch {
        menteeSelect.innerHTML = '<option value="">Could not load — refresh page</option>';
      }

      async function loadHistory() {
        try {
          let data;
          if (isLocal) {
            const wc = (offset) => {
              const d = new Date(); d.setDate(d.getDate() - offset);
              return d.toISOString().slice(0, 10);
            };
            data = { sessions: [
              { date: wc(1),  mentee: "Mary Chen",    status: "Pending", menteeId: "recMOCK1", next: wc(-6) },
              { date: wc(8),  mentee: "Priya Sharma", status: "Charged", menteeId: "recMOCK2" },
              { date: wc(9),  mentee: "Mary Chen",    status: "Charged", menteeId: "recMOCK1" },
              { date: wc(17), mentee: "Chen Wei",     status: "Package", menteeId: "recMOCK3" },
              { date: wc(24), mentee: "Chen Wei",     status: "Package", menteeId: "recMOCK3" },
            ] };
          } else {
            const res = await fetch("/.netlify/functions/get-sessions", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ mentorEmail }),
            });
            data = await res.json();
          }
          const rows = data.sessions || [];
          dash.sessions = rows;
          refreshDashboard();
          renderSessionHistory({ sessions: rows });
        } catch {
          renderSessionHistory({ error: "Could not load history — refresh page." });
        }
      }
      loadHistory();

      function resetForm() {
        const now   = new Date();
        const local = new Date(now.getTime() - now.getTimezoneOffset() * 60000);
        dateInput.value        = local.toISOString().split("T")[0];
        nextDateInput.value    = "";
        notesField.value       = "";
        submitBtn.disabled     = false;
        submitBtn.textContent  = "Log Session →";
        errorEl.textContent    = "";
      }

      document.getElementById("session-form").addEventListener("submit", async (e) => {
        e.preventDefault();

        const menteeRecordId = menteeSelect.value;
        const sessionDate    = dateInput.value;

        if (!menteeRecordId) { errorEl.textContent = "Please select a mentee."; return; }
        if (!sessionDate)    { errorEl.textContent = "Please pick a session date."; return; }

        submitBtn.disabled    = true;
        submitBtn.textContent = "Logging…";
        errorEl.textContent   = "";

        try {
          let result;
          if (isLocal) {
            const opt = menteeSelect.options[menteeSelect.selectedIndex];
            result = { success: true, menteeName: (opt ? opt.textContent : "mentee").replace(" — no card on file", "") };
          } else {
            const res = await fetch("/.netlify/functions/log-session", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                menteeRecordId,
                mentorEmail,
                sessionDate,
                nextSessionDate: nextDateInput.value || "",
                notes: notesField.value.trim(),
              }),
            });
            result = await res.json();
            if (!res.ok) throw new Error(result.error);
          }

          logCard.hidden = true;
          successCard.hidden = false;
          successDetail.textContent = `Logged for ${result.menteeName}.`;
          loadHistory();

          clearTimeout(window._successTimer);
          window._successTimer = setTimeout(() => {
            successCard.hidden = true;
            logCard.hidden     = false;
            successDetail.style.color = "";
            resetForm();
          }, 30000);
        } catch (err) {
          errorEl.textContent   = err.message || "Something went wrong. Please try again.";
          submitBtn.disabled    = false;
          submitBtn.textContent = "Log Session →";
        }
      });

      document.getElementById("log-another-btn")?.addEventListener("click", () => {
        clearTimeout(window._successTimer);
        successCard.hidden = true;
        logCard.hidden     = false;
        resetForm();
      });
    }
  </script>
  <style>
    /* Shared tokens, grain, and nav chrome live in portal.css (linked below). */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { font-size: 110%; scroll-behavior: smooth; }
    @media (max-width: 700px) { html { font-size: 95%; } }

    body { line-height: 1.6; overflow-x: hidden; }

    /* ── Main wrap ── */
    main {
      position: relative;
      z-index: 1;
      max-width: 1280px;
      margin: 0 auto;
      padding: 3.5rem 2rem 6rem;
      display: flex;
      flex-direction: column;
    }

    /* ── Hero ── */
    .hero {
      margin-bottom: 3.5rem;
      max-width: 980px;
    }
    .hero-eyebrow {
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 1rem;
    }
    .hero h1 {
      font-size: clamp(2.2rem, 4.2vw, 3rem);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.015em;
      margin-bottom: 1.1rem;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
    }
    .hero p {
      font-size: 1.15rem;
      line-height: 1.65;
      color: var(--text);
      max-width: 760px;
    }

    /* ── Tabs ── */
    .tab-panel { display: none; }
    .tab-panel.is-active { display: block; }

    /* Top tab strip (same on mobile and desktop) */
    .tabbar {
      display: flex;
      justify-content: center;
      gap: 0.2rem;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
      padding: 0 1rem;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tabbar::-webkit-scrollbar { display: none; }
    .tabbar__btn {
      flex: 0 0 auto;
      padding: 0.9rem 1.1rem;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      white-space: nowrap;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }
    .tabbar__btn:hover { color: var(--text); }
    .tabbar__btn.is-active { color: var(--accent-bright); border-bottom-color: var(--accent-bright); }

    /* Compact onboarding banner (shown on the Log tab until done) */
    .onboarding-incomplete { display: block; margin-bottom: 1.2rem; }
    .onboarding-complete { display: none; margin-bottom: 0.8rem; }
    [data-onboarded="true"] .onboarding-incomplete { display: none; }
    [data-onboarded="true"] .onboarding-complete { display: block; }
    .ob-banner {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      flex-wrap: wrap;
      padding: 0.9rem 1.1rem;
      border-radius: 12px;
      border: 1px solid var(--accent-line);
      background: rgba(199,155,59,0.05);
    }
    .ob-banner__text { flex: 1 1 160px; font-size: 0.9rem; color: var(--text); }
    .ob-banner .primary-cta { padding: 0.6rem 1rem; }

    /* ── Primary card (Log Session + featured Onboarding) ── */
    .primary-card {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 2.5rem;
      align-items: center;
      padding: 2.3rem 2.6rem;
      border-radius: 20px;
      border: 1px solid var(--accent-line);
      background:
        radial-gradient(circle at top right, var(--accent-soft), transparent),
        rgba(199,155,59,0.04);
      position: relative;
      overflow: hidden;
    }
    .primary-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(800px 200px at -100px 50%, var(--accent-soft), transparent);
      pointer-events: none;
      opacity: 0.5;
    }
    .primary-card-content { position: relative; }
    .primary-card-eyebrow {
      font-size: 0.7rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent-bright);
      font-weight: 700;
      margin-bottom: 0.6rem;
    }
    .primary-card h2 {
      font-size: 1.65rem;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -0.01em;
      margin-bottom: 0.7rem;
      color: var(--text);
    }
    .primary-card p {
      font-size: 1.02rem;
      line-height: 1.65;
      color: var(--text);
      max-width: 560px;
    }
    .primary-cta {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.95rem 1.6rem;
      border-radius: 999px;
      border: 1px solid var(--accent-line);
      background: linear-gradient(135deg, rgba(199,155,59,0.4), rgba(199,155,59,0.12));
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      white-space: nowrap;
      transition: transform 0.18s, box-shadow 0.18s, border-color 0.18s, background 0.18s;
      flex-shrink: 0;
      cursor: pointer;
    }
    .primary-cta:hover {
      transform: translateY(-2px);
      border-color: var(--accent-bright);
      box-shadow: 0 0 32px rgba(199,155,59,0.35);
      background: linear-gradient(135deg, rgba(199,155,59,0.55), rgba(199,155,59,0.2));
    }
    .primary-cta:focus-visible {
      outline: 2px solid var(--accent-bright);
      outline-offset: 3px;
    }
    .primary-cta .arrow { transition: transform 0.18s; }
    .primary-cta:hover .arrow { transform: translateX(3px); }

    /* Mark-as-completed link below the onboarding card */
    .mark-link-wrap {
      margin-top: 1rem;
      text-align: right;
    }
    .mark-link {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 0.78rem;
      letter-spacing: 0.04em;
      cursor: pointer;
      padding: 0.4rem 0.6rem;
      border-radius: 6px;
      text-decoration: underline;
      text-underline-offset: 3px;
      font-family: inherit;
      transition: color 0.15s, background 0.15s;
    }
    .mark-link:hover { color: var(--accent-bright); background: var(--accent-soft); }

    /* Compact completed card (onboarding once marked done) */
    .completed-card {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.3rem;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--bg-card);
    }
    .completed-check {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--accent-soft);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      flex-shrink: 0;
      border: 1px solid var(--accent-line);
    }
    .completed-card .text { flex: 1; }
    .completed-card .label {
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 0.15rem;
    }
    .completed-card .title {
      font-size: 0.98rem;
      color: var(--text);
      font-weight: 600;
    }
    .completed-card a.review {
      color: var(--accent);
      font-size: 0.8rem;
      text-decoration: underline;
      text-underline-offset: 3px;
      margin-right: 0.6rem;
    }
    .completed-card a.review:hover { color: var(--accent-bright); }

    /* ── Resource grid ── */
    .resource-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
      gap: 1.4rem;
    }
    .resource-card {
      display: flex;
      flex-direction: column;
      gap: 0.95rem;
      padding: 1.9rem 2rem 2rem;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: var(--bg-card);
      color: var(--text);
      text-decoration: none;
      position: relative;
      transition: transform 0.18s, box-shadow 0.18s, border-color 0.18s, background 0.18s;
      min-height: 220px;
    }
    .resource-card:hover {
      transform: translateY(-3px);
      border-color: var(--accent-line);
      background: var(--bg-card-hover);
      box-shadow: var(--shadow-card), var(--shadow-glow);
    }
    .resource-card:focus-visible {
      outline: 2px solid var(--accent-bright);
      outline-offset: 3px;
    }
    .resource-meta {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .resource-num {
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 0.25rem 0.55rem;
      border-radius: 5px;
    }
    .resource-ext {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid var(--accent-line);
      border-radius: 4px;
      padding: 0.18em 0.5em;
    }
    .resource-card h3 {
      font-size: 1.3rem;
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: -0.01em;
      color: var(--text);
    }
    .resource-card p {
      font-size: 0.98rem;
      line-height: 1.65;
      color: var(--text);
      flex: 1;
    }
    .resource-arrow {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      margin-top: 0.4rem;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      transition: color 0.18s;
    }
    .resource-card:hover .resource-arrow { color: var(--accent-bright); }
    .resource-arrow .arrow-icon { transition: transform 0.18s; display: inline-block; }
    .resource-card:hover .arrow-icon { transform: translateX(4px); }

    /* ── Footer ── */
    .footer-note {
      order: 100;
      margin-top: 4rem;
      padding-top: 1.4rem;
      border-top: 1px solid var(--line-soft);
      font-size: 0.78rem;
      color: var(--accent);
      letter-spacing: 0.04em;
      text-align: center;
    }

    @media (max-width: 700px) {
      main { padding: 2.5rem 1.2rem 4rem; }
      .primary-card { grid-template-columns: 1fr; gap: 1.2rem; padding: 1.3rem 1.3rem 1.5rem; }
      .primary-cta { justify-content: center; }
      .hero { margin-bottom: 2.2rem; }
      .form-row-2 { grid-template-columns: 1fr; }

      /* Centre the boxes and keep them off the screen edges */
      .tab-panel { max-width: 440px; margin-left: auto; margin-right: auto; }
      .resource-grid { grid-template-columns: 1fr; gap: 0.9rem; }
      .resource-card { min-height: 0; padding: 1.4rem 1.5rem; }
    }

    /* ── Session log form ── */
    .log-card { grid-template-columns: 1fr; align-items: flex-start; overflow: visible; }

    .session-form { display: flex; flex-direction: column; gap: 1rem; width: 100%; }

    .form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

    .form-field label {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.4rem;
    }

    .form-field select,
    .form-field input[type="date"],
    .form-field textarea {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 0.72rem 0.9rem;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      color-scheme: dark;
    }

    [data-theme="light"] .form-field select,
    [data-theme="light"] .form-field input[type="date"],
    [data-theme="light"] .form-field textarea {
      background: rgba(0,0,0,0.03);
      color-scheme: light;
    }

    /* Force legible dropdown options. Some browsers (notably Windows Chrome)
       ignore color-scheme and render the native option list on a white
       background while keeping the inherited white text — making every
       non-highlighted mentee invisible. Setting option colours explicitly
       fixes the "only one mentee shows" white-on-white bug. */
    .form-field select option {
      background: #1a1a1a;
      color: #ffffff;
    }
    [data-theme="light"] .form-field select option {
      background: #ffffff;
      color: #000000;
    }

    .form-field select:focus,
    .form-field input[type="date"]:focus,
    .form-field textarea:focus {
      border-color: var(--accent-line);
      box-shadow: 0 0 0 2px var(--accent-soft);
    }

    .form-field textarea { resize: vertical; min-height: 80px; }

    .session-submit {
      align-self: flex-start;
      background: var(--gold-gradient);
      border: none;
      border-radius: 999px;
      color: #2b1b09;
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      padding: 0.85rem 1.8rem;
      cursor: pointer;
      transition: filter 0.15s, opacity 0.15s;
    }
    .session-submit:hover { filter: brightness(1.06); }
    .session-submit:disabled { opacity: 0.55; cursor: not-allowed; filter: none; }

    .form-error {
      color: #ffb6b6;
      font-size: 0.85rem;
      min-height: 1.2em;
      margin: 0;
    }

    /* ── Success state ── */
    [hidden] { display: none !important; }

    .success-card {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      padding: 1.8rem 2rem;
      border-radius: 20px;
      border: 1px solid rgba(76,175,80,0.35);
      background: rgba(76,175,80,0.06);
    }
    .success-icon { font-size: 1.5rem; color: #4caf50; flex-shrink: 0; }
    .success-title { font-size: 1rem; font-weight: 700; color: var(--text); }
    .success-detail { font-size: 0.9rem; color: var(--accent); margin-top: 0.25rem; }
    .log-another {
      margin-left: auto;
      flex-shrink: 0;
      background: none;
      border: 1px solid var(--line);
      color: var(--text);
      padding: 0.5rem 1.1rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      font-family: inherit;
      transition: border-color 0.15s, color 0.15s;
    }
    .log-another:hover { border-color: var(--accent-line); color: var(--accent-bright); }

    /* ── Session history table ── */
    .history-wrap {
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      background: var(--bg-card);
    }
    .history-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    .history-table th {
      text-align: left;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      padding: 0.85rem 1.1rem;
      background: rgba(199,155,59,0.06);
      border-bottom: 1px solid var(--accent-line);
      white-space: nowrap;
    }
    .history-table td {
      padding: 0.8rem 1.1rem;
      border-bottom: 1px solid var(--line-soft);
      color: var(--text);
      vertical-align: middle;
    }
    .history-table tr:last-child td { border-bottom: none; }
    .history-table tbody tr:hover td { background: var(--bg-card-hover); }
    .history-table .mentee { font-weight: 600; }
    .status-pill {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      border: 1px solid var(--line);
      white-space: nowrap;
    }
    .status-Charged  { color: #4caf81; border-color: rgba(76,175,129,0.5); }
    .status-Pending  { color: #e0a030; border-color: rgba(224,160,48,0.5); }
    .status-Failed   { color: #e05050; border-color: rgba(224,80,80,0.5); }
    .status-Package  { color: var(--accent-bright); border-color: var(--accent-line); }
    .history-empty, .history-loading {
      padding: 1.6rem 1.1rem;
      color: var(--accent);
      font-size: 0.88rem;
      text-align: center;
    }

    /* ── Week-grouped history ── */
    .history-week { margin-bottom: 1.4rem; }
    .history-week__title {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent-bright);
      margin-bottom: 0.6rem;
    }
    .history-none {
      padding: 1rem 0 0.4rem;
      color: var(--accent);
      font-size: 0.88rem;
    }
    .history-controls {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      flex-wrap: wrap;
      margin: 0.4rem 0 1.4rem;
    }
    .history-select {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 0.5rem 0.8rem;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.85rem;
      cursor: pointer;
      outline: none;
      transition: border-color 0.15s;
    }
    .history-select:focus { border-color: var(--accent-line); }
    .history-select option { background: #1a1a1a; color: #ffffff; }
    [data-theme="light"] .history-select { background: rgba(0,0,0,0.03); }
    [data-theme="light"] .history-select option { background: #ffffff; color: #000000; }
    .history-toggle {
      background: transparent;
      border: 1px solid var(--accent-line);
      color: var(--accent-bright);
      border-radius: 999px;
      padding: 0.45rem 1rem;
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.15s;
    }
    .history-toggle:hover { background: var(--accent-soft); }

    /* Anchor targets land below the sticky nav */
    .portal-section, .section-anchor { scroll-margin-top: 100px; }
  </style>
  <link rel="stylesheet" href="portal.css" />
  <link rel="stylesheet" href="dashboard.css" />
  <link rel="stylesheet" href="/mentor-portal/polish.css" />
</head>
<body>

  <div id="portal-nav"></div>

  <nav class="tabbar" id="tabbar" aria-label="Sections">
    <button class="tabbar__btn is-active" type="button" data-tab="log">Log</button>
    <button class="tabbar__btn" type="button" data-tab="mentees">Mentees</button>
    <button class="tabbar__btn" type="button" data-tab="history">History</button>
    <button class="tabbar__btn" type="button" data-tab="resources">Resources</button>
  </nav>

  <main>

    <!-- LOG -->
    <section class="tab-panel is-active" data-panel="log">
      <div class="onboarding-incomplete">
        <div class="ob-banner">
          <span class="ob-banner__text">Finish onboarding before your first session.</span>
          <a class="primary-cta" href="../html/mentor-onboarding.html">Start <span class="arrow">&rarr;</span></a>
          <button class="mark-link" id="mark-complete" type="button">Mark done</button>
        </div>
      </div>
      <div class="onboarding-complete">
        <button class="mark-link" id="mark-incomplete" type="button">Redo onboarding</button>
      </div>

      <div class="primary-card log-card" id="log-card">
        <form class="session-form" id="session-form">
          <div class="form-row-2">
            <div class="form-field">
              <label for="mentee-select">Mentee</label>
              <select id="mentee-select"><option value="">Loading&hellip;</option></select>
            </div>
            <div class="form-field">
              <label for="session-date">Session date</label>
              <input type="date" id="session-date" />
            </div>
          </div>
          <div class="form-row-2">
            <div class="form-field">
              <label for="next-session-date">Next session <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--accent);opacity:0.6">- tentative is fine</span></label>
              <input type="date" id="next-session-date" />
            </div>
          </div>
          <div class="form-field">
            <label for="session-notes">Notes</label>
            <textarea id="session-notes"></textarea>
          </div>
          <button type="submit" class="session-submit" id="session-submit-btn">Log session &rarr;</button>
          <p class="form-error" id="form-error" aria-live="polite"></p>
        </form>
      </div>

      <div class="success-card" id="success-card" hidden>
        <div class="success-icon">&#10003;</div>
        <div>
          <div class="success-title">Logged</div>
          <div class="success-detail" id="success-detail"></div>
        </div>
        <button class="log-another" id="log-another-btn">Log another &rarr;</button>
      </div>
    </section>

    <!-- MENTEES -->
    <section class="tab-panel" data-panel="mentees" id="mentee-dash-section">
      <div class="mentee-grid" id="mentee-grid"></div>
    </section>

    <!-- HISTORY -->
    <section class="tab-panel" data-panel="history">
      <div id="history-root"><p class="history-none">Loading&hellip;</p></div>
    </section>

    <!-- RESOURCES -->
    <section class="tab-panel" data-panel="resources">
      <div class="resource-grid">
        <a class="resource-card" href="../html/tutor-resources.html">
          <div class="resource-meta"><span class="resource-num">01</span></div>
          <h3>Mentor Resource Hub</h3>
          <p>Resume, LinkedIn, cover letters, networking, interview questions.</p>
          <span class="resource-arrow">Open <span class="arrow-icon">&rarr;</span></span>
        </a>
        <a class="resource-card" href="https://docs.google.com/document/d/1D_OHsA1uESXiiDrlh8nydSpFhxg8RlTP17M97_UWejM/edit?usp=sharing" target="_blank" rel="noopener">
          <div class="resource-meta"><span class="resource-num">02</span><span class="resource-ext">Google Doc</span></div>
          <h3>Stand Out &amp; Break In Tracker</h3>
          <p>Per-mentee progress tracker. Copy one per mentee.</p>
          <span class="resource-arrow">Open <span class="arrow-icon">&rarr;</span></span>
        </a>
      </div>
    </section>

  </main>

  <script>
    (function () {
      var root = document.documentElement;

      /* Theme handling lives in portal-ui.js (shared across all portal pages). */

      /* ── Onboarding completion persistence ── */
      var ONB_KEY = 'headstart_onboarded';
      function applyOnboarded(done) {
        if (done) {
          root.setAttribute('data-onboarded', 'true');
        } else {
          root.removeAttribute('data-onboarded');
        }
        try { localStorage.setItem(ONB_KEY, done ? 'true' : 'false'); } catch (e) {}
      }
      var savedOnboarded = false;
      try { savedOnboarded = localStorage.getItem(ONB_KEY) === 'true'; } catch (e) {}
      applyOnboarded(savedOnboarded);

      document.getElementById('mark-complete').addEventListener('click', function () {
        applyOnboarded(true);
      });
      document.getElementById('mark-incomplete').addEventListener('click', function () {
        applyOnboarded(false);
      });

      /* ── Bottom tabs ── */
      var TAB_KEY = 'headstart_portal_tab';
      var tabbar = document.getElementById('tabbar');
      function showTab(name) {
        var panels = document.querySelectorAll('.tab-panel');
        var found = false;
        panels.forEach(function (p) {
          var on = p.getAttribute('data-panel') === name;
          p.classList.toggle('is-active', on);
          if (on) found = true;
        });
        if (!found) name = 'log';
        document.querySelectorAll('.tab-panel').forEach(function (p) {
          p.classList.toggle('is-active', p.getAttribute('data-panel') === name);
        });
        tabbar.querySelectorAll('.tabbar__btn').forEach(function (b) {
          b.classList.toggle('is-active', b.getAttribute('data-tab') === name);
        });
        try { localStorage.setItem(TAB_KEY, name); } catch (e) {}
        window.scrollTo(0, 0);
      }
      tabbar.addEventListener('click', function (e) {
        var b = e.target.closest('.tabbar__btn');
        if (b) showTab(b.getAttribute('data-tab'));
      });
      var savedTab = 'log';
      try { savedTab = localStorage.getItem(TAB_KEY) || 'log'; } catch (e) {}
      showTab(savedTab);
    })();
  </script>

</body>
</html>
