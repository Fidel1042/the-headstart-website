<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <title>Mentor Agreements – The Headstart</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
  <style id="auth-gate">
    html:not(.auth-ok) body { visibility: hidden; }
    html:not(.auth-ok) { background: #fff; }
  </style>
  <link rel="stylesheet" href="portal.css" />
  <link rel="stylesheet" href="portal-nav.css" />
  <link rel="stylesheet" href="/mentor-portal/polish.css" />
  <style>
    .ag-page { max-width: 860px; margin: 0 auto; padding: 1.6rem 1.2rem 4rem; }
    .ag-head h1 { font-size: 1.4rem; font-weight: 800; margin: 0 0 1.4rem; }

    .sec__title {
      font-size: 0.66rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--accent); margin: 1.6rem 0 0.7rem;
      display: flex; align-items: center; gap: 0.5rem;
    }
    .sec__count { color: var(--text-muted); font-variant-numeric: tabular-nums; }

    .m {
      display: flex; align-items: center; gap: 0.8rem; flex-wrap: wrap;
      border: 1px solid var(--line); border-radius: 14px; background: var(--bg-card);
      padding: 0.8rem 1.05rem; margin-bottom: 0.55rem;
    }
    .m__name { font-weight: 700; font-size: 0.95rem; min-width: 8rem; }
    .m__rate { font-size: 0.95rem; font-weight: 800; font-variant-numeric: tabular-nums; }
    .m__meta { font-size: 0.74rem; color: var(--text-muted); }
    .m__spacer { flex: 1; }
    .m.is-blocked { border-color: rgba(224,80,80,0.45); }
    .warn { color: #c33; font-size: 0.74rem; font-weight: 700; }

    .act {
      font-family: inherit; font-size: 0.68rem; font-weight: 800;
      letter-spacing: 0.04em; text-transform: uppercase;
      min-height: 36px; padding: 0 0.85rem; box-sizing: border-box;
      border-radius: 999px; cursor: pointer; white-space: nowrap;
      background: transparent; color: var(--accent); border: 1px solid var(--accent-line);
    }
    .act:hover { background: var(--accent-soft); }
    .act:disabled { opacity: 0.45; cursor: not-allowed; }
    .act--send { border-color: var(--line); color: var(--text-muted); }
    .act--send:hover:not(:disabled) { border-color: var(--accent-line); color: var(--accent); }
    .saved { font-size: 0.72rem; color: #2e7d52; }
    [data-theme="dark"] .saved { color: #6fd39b; }
    .oops { font-size: 0.72rem; color: #c33; }
    .state { font-size: 0.9rem; color: var(--text-muted); padding: 2rem 0; text-align: center; }
    .quiet { font-size: 0.8rem; color: var(--text-muted); }
    .legacy { margin-top: 1.6rem; }
    .legacy summary {
      font-size: 0.72rem; color: var(--text-muted); cursor: pointer;
      padding: 0.4rem 0; list-style: none;
    }
    .legacy summary::before { content: "\25B8 "; }
    .legacy[open] summary::before { content: "\25BE "; }
  </style>
</head>
<body>

  <div id="portal-nav"></div>

  <main class="ag-page">
    <div class="ag-head">
      <h1>Mentor agreements</h1>
    </div>

    <p class="state" id="loading">Loading&hellip;</p>
    <p class="state" id="error" hidden></p>

    <div id="content" hidden>
      <p class="sec__title">Not signed yet <span class="sec__count" id="todo-count"></span></p>
      <div id="todo"></div>

      <p class="sec__title">Signed <span class="sec__count" id="done-count"></span></p>
      <div id="done"></div>

      <details class="legacy">
        <summary>On the old signed document <span id="legacy-count"></span></summary>
        <div id="legacy"></div>
      </details>
    </div>
  </main>

  <script type="module">
    import { requireAuth } from "./auth.js";
    import { mountPortalNav, initTheme } from "./portal-ui.js";

    initTheme();

    const SITE = "https://theheadstartmentoring.com";
    let ADMIN_EMAIL = "";
    let DATA = null;

    const esc = (v) => String(v == null ? "" : v)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    const link = (m) => `${SITE}/mentor-agreement?m=${m.id}`;
    const fmt = (d) => d
      ? new Date(d + "T00:00:00").toLocaleDateString("en-AU", { day: "numeric", month: "short" })
      : "";

    requireAuth((session) => {
      const email = session?.user?.email || "";
      const OWNERS = ["fidelhon@gmail.com", "kokoro.araki1015@gmail.com"];
      if (!OWNERS.includes(email) && email !== "dev@localhost") {
        window.location.replace("/mentor-portal/index.html");
        return;
      }
      ADMIN_EMAIL = email;
      mountPortalNav({ email, isOwner: true, active: "agreements" });
      load();
    });

    async function load() {
      const loading = document.getElementById("loading");
      const errorEl = document.getElementById("error");
      loading.hidden = false; errorEl.hidden = true;
      try {
        const res = await fetch("/.netlify/functions/mentor-terms", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "list", adminEmail: ADMIN_EMAIL }),
        });
        const body = await res.text();
        if (body.trim().startsWith("<")) {
          throw new Error("This page needs the live site. Preview mode cannot run " +
            "the data function, so there is nothing to show until it is pushed.");
        }
        DATA = JSON.parse(body);
        if (!res.ok) throw new Error(DATA.error || "Could not load");
      } catch (err) {
        loading.hidden = true;
        errorEl.textContent = err.message || "Could not load — refresh to try again.";
        errorEl.hidden = false;
        return;
      }
      loading.hidden = true;
      render();
      document.getElementById("content").hidden = false;
    }

    // How long a contract has been sitting unsigned. The number is the whole
    // point: a day is nothing, a week means chase them.
    function ago(iso) {
      const days = Math.floor((Date.now() - new Date(iso)) / 86400000);
      if (days <= 0) return "sent today";
      if (days === 1) return "sent yesterday";
      return `sent ${days} days ago`;
    }
    // Turns red at a week, which is when silence stops being normal.
    function chaseClass(iso) {
      const days = Math.floor((Date.now() - new Date(iso)) / 86400000);
      return days >= 7 ? "warn" : "m__meta";
    }

    function row(m) {
      // No rate means the agreement would show nothing to agree to, so the
      // link is withheld rather than sent and then apologised for.
      const blocked = !m.rateSet;
      return `
        <div class="m${blocked ? " is-blocked" : ""}">
          <span class="m__name">${esc(m.name)}</span>
          <span class="m__rate">${m.rateSet ? "$" + m.rate : "—"}</span>
          <span class="m__meta">${m.rateSet ? "per session" : ""}</span>
          ${blocked ? `<span class="warn">Set a rate in Airtable first</span>` : ""}
          ${m.rateChanged ? `<span class="warn">signed at $${m.agreedRate}, now $${m.rate}</span>` : ""}
          ${m.signed ? `<span class="m__meta">signed ${esc(fmt(m.signed))}</span>` : ""}
          ${!m.signed && m.contractSent
            ? `<span class="${chaseClass(m.contractSent)}">${esc(ago(m.contractSent))}</span>` : ""}
          ${!m.signed && !m.contractSent && !blocked
            ? `<span class="m__meta">not sent yet</span>` : ""}
          <span class="m__spacer"></span>
          <button type="button" class="act" data-copy="${m.id}" ${blocked ? "disabled" : ""}>
            ${m.signed ? "Copy link" : "Copy link"}
          </button>
          <button type="button" class="act act--send" data-offer="${m.id}" ${blocked ? "disabled" : ""}>
            ${m.signed ? "Resend email" : "Email contract"}
          </button>
          <span class="note" data-note="${m.id}"></span>
        </div>`;
    }

    function render() {
      // Three states, not two. Somebody on the old paper version is finished,
      // they just did not finish here.
      const legacy = DATA.mentors.filter((m) => m.legacy && !m.signed);
      const todo = DATA.mentors.filter((m) => !m.signed && !m.legacy)
        // Longest wait at the top. Anyone never sent a contract sits last,
        // since that is a different job from chasing.
        .sort((a, b) => (a.contractSent || "9999").localeCompare(b.contractSent || "9999"));
      const done = DATA.mentors.filter((m) => m.signed);

      document.getElementById("todo-count").textContent = todo.length;
      document.getElementById("done-count").textContent = done.length;
      document.getElementById("legacy-count").textContent = `(${legacy.length})`;

      document.getElementById("todo").innerHTML = todo.length
        ? todo.map(row).join("")
        : `<p class="quiet">Nobody waiting. New mentors show up here once they are
             set to Hired with a rate.</p>`;
      document.getElementById("done").innerHTML = done.length
        ? done.map(row).join("")
        : `<p class="quiet">Nobody has signed the online version yet.</p>`;
      document.getElementById("legacy").innerHTML = legacy.map(row).join("");
    }

    document.addEventListener("click", async (e) => {
      const off = e.target.closest("[data-offer]");
      if (off) {
        const m = DATA.mentors.find((x) => x.id === off.dataset.offer);
        if (!m) return;
        // A real email to a real person, so it asks first.
        if (!confirm(`Email the contract to ${m.name}?\n\nIt goes to ${m.email} ` +
          `and shows their rate of $${m.rate} per session.`)) return;
        const note = off.closest(".m").querySelector("[data-note]");
        const was = off.textContent.trim();
        off.disabled = true; off.textContent = "Sending…"; note.textContent = "";
        try {
          const res = await fetch("/.netlify/functions/mentor-terms", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action: "offer", mentorId: m.id, adminEmail: ADMIN_EMAIL }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || "Could not send");
          note.className = "saved";
          note.textContent = `Sent to ${data.to}`;
          off.textContent = "Resend email";
        } catch (err) {
          note.className = "oops";
          note.textContent = err.message;
          off.textContent = was;
        } finally { off.disabled = false; }
        return;
      }

      const btn = e.target.closest("[data-copy]");
      if (!btn) return;
      const m = DATA.mentors.find((x) => x.id === btn.dataset.copy);
      if (!m) return;
      const original = btn.textContent.trim();
      navigator.clipboard.writeText(link(m)).then(() => {
        btn.textContent = "Copied";
        setTimeout(() => { btn.textContent = original; }, 2000);
      });
    });
  </script>
</body>
</html>
