<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <title>Reset password – Headstart Mentor Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <link rel="manifest" href="/mentor-portal/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/mentor-portal/icons/icon-180.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Headstart" />
  <meta name="format-detection" content="telephone=no" />
  <script defer src="/mentor-portal/pwa.js"></script>
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
  <link rel="stylesheet" href="auth.css" />
  <link rel="stylesheet" href="/mentor-portal/polish.css" />
</head>
<body>

  <main class="auth-wrap">
    <a href="./" class="auth-logo" aria-label="Mentor portal home">
      <img src="../images/headstart-italic-logo.png" alt="The Headstart" />
    </a>

    <h1 id="reset-title">Reset password</h1>
    <p class="auth-sub" id="reset-sub">Enter your email and we'll send you a link to set a new password.</p>

    <div id="error-banner" class="auth-error" hidden></div>
    <div id="info-banner" class="auth-info" hidden></div>

    <!-- Step 1: request a reset link -->
    <form id="request-form" class="auth-form">
      <label class="auth-field">
        <span>Email</span>
        <input type="email" name="email" autocomplete="email" required />
      </label>
      <button class="auth-primary" type="submit" id="request-submit">Send reset link</button>
    </form>

    <!-- Step 2: set a new password (shown after clicking the emailed link) -->
    <form id="update-form" class="auth-form" hidden>
      <label class="auth-field">
        <span>New password</span>
        <input type="password" name="password" autocomplete="new-password" required minlength="8" />
      </label>
      <label class="auth-field">
        <span>Confirm new password</span>
        <input type="password" name="confirm" autocomplete="new-password" required minlength="8" />
      </label>
      <button class="auth-primary" type="submit" id="update-submit">Update password</button>
    </form>

    <p class="auth-footer">
      <a href="login.html" id="back-link">Back to sign in</a>
    </p>
  </main>

  <script type="module">
    import { supabase } from "./auth.js";

    const requestForm = document.getElementById("request-form");
    const updateForm  = document.getElementById("update-form");
    const title       = document.getElementById("reset-title");
    const sub         = document.getElementById("reset-sub");
    const errorBanner = document.getElementById("error-banner");
    const infoBanner  = document.getElementById("info-banner");

    function showError(msg) { errorBanner.textContent = msg; errorBanner.hidden = false; infoBanner.hidden = true; }
    function showInfo(msg)  { infoBanner.textContent = msg; infoBanner.hidden = false; errorBanner.hidden = true; }
    function clearBanners()  { errorBanner.hidden = true; infoBanner.hidden = true; }

    // When the mentor arrives from the emailed link, Supabase parses the
    // recovery token from the URL and fires PASSWORD_RECOVERY. Swap to the
    // "set a new password" form.
    supabase.auth.onAuthStateChange((event) => {
      if (event === "PASSWORD_RECOVERY") {
        title.textContent = "Set a new password";
        sub.textContent = "Choose a new password for your mentor account.";
        requestForm.hidden = true;
        updateForm.hidden = false;
        clearBanners();
      }
    });

    // Step 1: send the reset email
    requestForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearBanners();
      const submit = document.getElementById("request-submit");
      const email = String(new FormData(e.target).get("email") || "").trim();
      submit.disabled = true;
      submit.textContent = "Sending…";
      const { error } = await supabase.auth.resetPasswordForEmail(email, {
        redirectTo: `${window.location.origin}/mentor-portal/reset-password.html`,
      });
      submit.disabled = false;
      submit.textContent = "Send reset link";
      if (error) {
        showError(error.message || "Could not send reset link. Try again.");
        return;
      }
      // Always show success (does not reveal whether an account exists).
      showInfo("Check your email for a link to reset your password. It can take a minute to arrive, and check your spam folder.");
    });

    // Step 2: save the new password
    updateForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearBanners();
      const submit = document.getElementById("update-submit");
      const fd = new FormData(e.target);
      const password = String(fd.get("password") || "");
      const confirm  = String(fd.get("confirm") || "");
      if (password !== confirm) {
        showError("The two passwords don't match.");
        return;
      }
      submit.disabled = true;
      submit.textContent = "Updating…";
      const { error } = await supabase.auth.updateUser({ password });
      submit.disabled = false;
      submit.textContent = "Update password";
      if (error) {
        showError(error.message || "Could not update password. Request a fresh link and try again.");
        return;
      }
      showInfo("Password updated. Redirecting you to the portal…");
      setTimeout(() => window.location.replace("./"), 1500);
    });
  </script>

</body>
</html>
