<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <title>LTV – The Headstart</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
  <style id="auth-gate">
    html:not(.auth-ok) body { visibility: hidden; }
    html:not(.auth-ok) { background: #fff; }
  </style>
  <link rel="stylesheet" href="portal.css" />
  <link rel="stylesheet" href="portal-nav.css" />
  <link rel="stylesheet" href="/mentor-portal/polish.css" />
  <style>
    .lv-page { max-width: 1000px; margin: 0 auto; padding: 1.6rem 1.2rem 4rem; }
    .lv-head h1 { font-size: 1.4rem; font-weight: 800; margin: 0 0 1.4rem; }

    .filters { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; margin-bottom: 1.4rem; }
    .filters select {
      font-family: inherit; font-size: 0.78rem; min-height: 34px; box-sizing: border-box;
      padding: 0 0.6rem; border: 1px solid var(--line); border-radius: 999px;
      background: var(--bg); color: var(--text); cursor: pointer;
    }
    .filters label { display: flex; align-items: center; gap: 0.35rem; font-size: 0.78rem; cursor: pointer; }
    .filters input { width: 0.95rem; height: 0.95rem; accent-color: var(--accent); cursor: pointer; }

    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 0.7rem; margin-bottom: 1.6rem; }
    .tile { border: 1px solid var(--line); border-radius: 12px; padding: 0.8rem 0.95rem; }
    .tile__v { font-size: 1.35rem; font-weight: 800; font-variant-numeric: tabular-nums; }
    .tile__l { font-size: 0.73rem; color: var(--text-muted); margin-top: 0.15rem; }

    .tbl-wrap { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; font-size: 0.83rem; }
    th, td { text-align: left; padding: 0.5rem 0.8rem 0.5rem 0; border-bottom: 1px solid var(--line-soft); }
    th { font-size: 0.67rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted);
      cursor: pointer; white-space: nowrap; }
    th:hover { color: var(--text); }
    th.is-sort { color: var(--accent); }
    td:not(:first-child), th:not(:first-child) { text-align: right; font-variant-numeric: tabular-nums; }
    td.mentor, th.mentor { text-align: left; }
    .bar { display: inline-block; height: 6px; border-radius: 3px; background: var(--accent);
      vertical-align: middle; margin-right: 0.45rem; min-width: 2px; }
    .unreal { font-size: 0.7rem; color: var(--accent); }
    .alias { font-size: 0.68rem; color: var(--text-muted); }
    .orphan { font-size: 0.68rem; color: #c33; }

    .state { font-size: 0.9rem; color: var(--text-muted); padding: 2rem 0; text-align: center; }
    .lv-foot { font-size: 0.72rem; color: var(--text-muted); margin-top: 1.4rem; }
  </style>
</head>
<body>

  <div id="portal-nav"></div>

  <main class="lv-page">
    <div class="lv-head">
      <h1>Lifetime value</h1>
    </div>

    <div class="filters" id="filters" hidden>
      <select id="f-mentor"><option value="">All mentors</option></select>
      <select id="f-billing"><option value="">All pay groups</option></select>
      <label><input type="checkbox" id="f-prepaid" /> Only unrealised prepay</label>
      <label><input type="checkbox" id="f-active" /> Hide never-charged</label>
    </div>

    <p class="state" id="loading">Loading&hellip;</p>
    <p class="state" id="error" hidden></p>

    <div id="content" hidden>
      <div class="tiles" id="tiles"></div>
      <div class="tbl-wrap">
        <table>
          <thead><tr>
            <th class="mentor" data-sort="name">Mentee</th>
            <th data-sort="ltv" class="is-sort">LTV</th>
            <th data-sort="sessions">Sessions</th>
            <th data-sort="rate">Rate</th>
            <th class="mentor" data-sort="mentor">Mentor</th>
          </tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p class="lv-foot" id="foot"></p>
    </div>
  </main>

  <script type="module" src="./ltv.js"></script>
</body>
</html>
