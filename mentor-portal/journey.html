<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <title>Customer Journey – The Headstart</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
  <style id="auth-gate">
    html:not(.auth-ok) body { visibility: hidden; }
    html:not(.auth-ok) { background: #fff; }
  </style>
  <link rel="stylesheet" href="portal.css" />
  <link rel="stylesheet" href="portal-nav.css" />
  <link rel="stylesheet" href="/mentor-portal/polish.css" />
  <style>
    .jr-page { max-width: 1180px; margin: 0 auto; padding: 1.6rem 1.2rem 4rem; }
    /* 1100px fitted five stages. Sign-up made six, and six nodes plus four
       arrows plus the reminder-email midpoint need ~1101px of run, so the row
       was scrolling inside the column and the last circle sat half off screen.
       The .flow overflow rule below is still the fallback for narrow screens. */
    .jr-head h1 { font-size: 1.4rem; font-weight: 800; margin: 0 0 0.9rem; }

    .win { display: flex; gap: 0.35rem; margin-bottom: 2rem; }
    .win__b {
      font-family: inherit; font-size: 0.72rem; font-weight: 700;
      letter-spacing: 0.04em; text-transform: uppercase;
      min-height: 34px; padding: 0 0.85rem; box-sizing: border-box;
      border: 1px solid var(--line); border-radius: 999px;
      background: transparent; color: var(--text-muted); cursor: pointer;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }
    .win__b:hover { color: var(--text); border-color: var(--accent-line); }
    .win__b.is-on { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); }
    .win.is-busy { opacity: 0.5; pointer-events: none; }

    .cmp-bar { display: flex; align-items: center; gap: 0.9rem; flex-wrap: wrap;
      margin: -1.2rem 0 2rem; }
    .cmp__lead { font-size: 0.72rem; color: var(--text-muted); }
    .cmp__box { display: flex; align-items: center; gap: 0.35rem;
      font-size: 0.75rem; cursor: pointer; user-select: none; }
    .cmp__box input { width: 0.95rem; height: 0.95rem; accent-color: var(--accent); cursor: pointer; }

    /* The comparison line under a stat. Green when the window being viewed is
       better than the one compared against, red when worse. "Better" is not
       always higher: a rise in no-shows or in days waited is worse, and those
       stats are marked so the colour cannot invert. */
    .cell__cmp { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.45rem;
      padding-top: 0.4rem; border-top: 1px solid var(--line-soft); }
    .cmp { font-size: 0.7rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }
    .cmp b { font-weight: 700; opacity: 0.7; margin-right: 0.15rem; }
    .cmp.is-up { color: #2e7d52; }
    .cmp.is-down { color: #c33; }
    [data-theme="dark"] .cmp.is-up { color: #6fd39b; }
    [data-theme="dark"] .cmp.is-down { color: #ff8b8b; }

    /* ── The flow: four circles, dotted line between them ── */
    .flow {
      display: flex; align-items: flex-start;
      /* "safe" centring falls back to the start when the row is too wide to
         fit. Plain `center` traps the first circle off the left edge on a
         phone, where it cannot be scrolled back to. */
      justify-content: safe center;
      gap: 0; margin-bottom: 2.4rem; flex-wrap: nowrap;
      overflow-x: auto; padding-bottom: 0.5rem; scrollbar-width: none;
    }
    .flow::-webkit-scrollbar { display: none; }

    .node {
      flex: 0 0 auto; display: flex; flex-direction: column; align-items: center;
      background: none; border: 0; padding: 0; cursor: pointer;
      font-family: inherit; color: var(--text); width: 9.5rem;
    }
    .node__dot {
      width: 7rem; height: 7rem; border-radius: 50%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: var(--accent); color: #fff;
      box-shadow: 0 6px 18px rgba(199,155,59,0.35);
      transition: transform 0.18s cubic-bezier(0.2,0.8,0.3,1), box-shadow 0.18s;
    }
    /* The accent flips between a dark gold on white and a bright gold on black,
       so the text on it has to flip too. White reads 5.5:1 in light mode but
       only 2.6:1 in dark; near-black gets 6.8:1 back. */
    [data-theme="dark"] .node__dot { color: #241703; }
    [data-theme="dark"] .node.is-on .node__dot {
      box-shadow: inset 0 0 0 3px rgba(0,0,0,0.35), 0 8px 22px rgba(199,155,59,0.5);
    }
    .node:hover .node__dot { transform: translateY(-3px); }
    /* The selected ring is drawn inside the circle, not around it. An outer
       ring or a lift would make the chosen circle sit off the row's baseline. */
    .node.is-on .node__dot {
      box-shadow: inset 0 0 0 3px rgba(255,255,255,0.55), 0 8px 22px rgba(199,155,59,0.5);
    }
    .node__big { font-size: 1.45rem; font-weight: 800; line-height: 1.1; }
    .node__unit {
      font-size: 0.6rem; font-weight: 700; letter-spacing: 0.05em;
      text-transform: uppercase; opacity: 0.9; margin-top: 0.2rem;
      /* Never wider than the circle it sits in. */
      max-width: 5.4rem; line-height: 1.25; text-wrap: balance;
    }
    /* min-height so every label and caption starts on the same line, whatever
       the text length. Sized to the longest: two lines of caption. */
    .node__name { font-size: 0.92rem; font-weight: 800; margin-top: 0.75rem; min-height: 1.3em; }
    .node__cap { font-size: 0.72rem; color: var(--text-muted); margin-top: 0.2rem;
      min-height: 2.6em; line-height: 1.3; padding: 0 0.2rem; }
    .node.is-off .node__dot { background: var(--text-muted); box-shadow: none; }

    .link { flex: 0 0 auto; display: flex; align-items: center; padding: 0 0.3rem; margin-top: 3.1rem; }
    .link__arrow { font-size: 1rem; color: var(--accent-line); line-height: 1; }

    /* A midpoint: a small circle between two arrows, opening a panel like the
       big circles do. Only a gap with something of its own to say gets one. */
    .mid {
      flex: 0 0 auto; display: flex; flex-direction: column; align-items: center;
      background: none; border: 0; padding: 0; cursor: pointer;
      font-family: inherit; color: var(--text); width: 5.4rem;
    }
    .mid__dot {
      width: 3.4rem; height: 3.4rem; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.85rem; font-weight: 800; font-variant-numeric: tabular-nums;
      background: var(--bg-card); color: var(--accent);
      border: 1.5px solid var(--accent-line);
      transition: transform 0.18s cubic-bezier(0.2,0.8,0.3,1), background 0.15s;
    }
    .mid:hover .mid__dot { transform: translateY(-2px); }
    .mid.is-on .mid__dot { background: var(--accent-soft); border-width: 2.5px; }
    .mid__name {
      font-size: 0.63rem; font-weight: 700; color: var(--text-muted);
      margin-top: 0.45rem; line-height: 1.25; text-align: center;
    }
    /* Sits level with the big circles' centres, which are 7rem tall. */
    .mid { margin-top: 1.8rem; }

    /* ── The panel a circle opens ── */
    .panel {
      border: 1px solid var(--line); border-radius: 16px; background: var(--bg-card);
      padding: 1.3rem 1.4rem; animation: rise 0.22s cubic-bezier(0.2,0.8,0.3,1);
    }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
    @media (prefers-reduced-motion: reduce) {
      .panel { animation: none; }
      .node__dot, .node:hover .node__dot { transition: none; transform: none; }
    }
    .panel__top { display: flex; align-items: baseline; gap: 0.7rem; flex-wrap: wrap;
      margin-bottom: 1.1rem; }
    .panel__name { font-size: 1.05rem; font-weight: 800; }
    .panel__sub { font-size: 0.8rem; color: var(--text-muted); }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 0.7rem; margin-bottom: 1.2rem; }
    .cell { border: 1px solid var(--line); border-radius: 12px; padding: 0.75rem 0.9rem; }
    /* The change sits beside the number at the same weight and size, because
       when a comparison is ticked it is the thing being looked at. */
    .cell__top { display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap; }
    .cell__v { font-size: 1.3rem; font-weight: 800; font-variant-numeric: tabular-nums; }
    .cell__d {
      font-size: 1.3rem; font-weight: 800; font-variant-numeric: tabular-nums;
      color: var(--text-muted);
    }
    .cell__d.is-up { color: #2e7d52; }
    .cell__d.is-down { color: #c33; }
    [data-theme="dark"] .cell__d.is-up { color: #6fd39b; }
    [data-theme="dark"] .cell__d.is-down { color: #ff8b8b; }
    .cell__l { font-size: 0.74rem; color: var(--text-muted); margin-top: 0.15rem; }
    .cell__n { font-size: 0.7rem; color: var(--accent); margin-top: 0.25rem; min-height: 1em; }
    .cell.is-warn { border-color: rgba(224,80,80,0.45); }
    .cell.is-warn .cell__n { color: #c33; }

    .tbl-wrap { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; font-size: 0.82rem; }
    th, td { text-align: left; padding: 0.45rem 0.8rem 0.45rem 0; border-bottom: 1px solid var(--line-soft); }
    th { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); }
    td:not(:first-child), th:not(:first-child) { text-align: right; font-variant-numeric: tabular-nums; }
    .tbl-note { font-size: 0.72rem; color: var(--text-muted); margin: 0.6rem 0 1.4rem; }
    .tbl-title {
      font-size: 0.68rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--accent); margin: 0 0 0.5rem;
    }
    tbody tr:last-child td { font-weight: 700; border-bottom: none; }

    .state { font-size: 0.9rem; color: var(--text-muted); padding: 2rem 0; text-align: center; }
    .jr-foot { font-size: 0.72rem; color: var(--text-muted); margin-top: 1.6rem; text-align: center; }

    @media (max-width: 700px) {
      .node { width: 7.5rem; }
      .node__dot { width: 5.5rem; height: 5.5rem; }
      .node__big { font-size: 1.1rem; }
      .link { margin-top: 2.4rem; }
      .mid { width: 4.4rem; margin-top: 1.4rem; }
      .mid__dot { width: 2.8rem; height: 2.8rem; font-size: 0.74rem; }
    }
  </style>
</head>
<body>

  <div id="portal-nav"></div>

  <main class="jr-page">
    <div class="jr-head">
      <h1>Customer journey</h1>
      <div class="win" id="win" role="group" aria-label="Time window">
        <button type="button" class="win__b" data-w="7">7 days</button>
        <button type="button" class="win__b is-on" data-w="28">28 days</button>
        <button type="button" class="win__b" data-w="90">90 days</button>
      </div>
      <div class="cmp-bar" id="cmp"></div>
    </div>

    <p class="state" id="loading">Loading&hellip;</p>
    <p class="state" id="error" hidden></p>

    <div id="content" hidden>
      <div class="flow" id="flow"></div>
      <div id="panel"></div>
      <p class="jr-foot" id="foot"></p>
    </div>
  </main>

  <script type="module" src="./journey.js"></script>
</body>
</html>
