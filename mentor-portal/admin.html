<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <title>Admin – The Headstart</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
  <style id="auth-gate">html:not(.auth-ok) body { visibility: hidden; }</style>
  <link rel="stylesheet" href="portal.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>

  <div id="portal-nav"></div>

  <main class="admin-page">

    <h1 class="admin-title">Mentor Overview</h1>

    <div class="stat-row" id="stat-row" hidden>
      <div class="stat-tile">
        <span class="stat-tile__num" id="stat-active">—</span>
        <span class="stat-tile__label">Active mentors (30d)</span>
      </div>
      <div class="stat-tile">
        <span class="stat-tile__num" id="stat-mentees">—</span>
        <span class="stat-tile__label">Mentees</span>
      </div>
      <div class="stat-tile">
        <span class="stat-tile__num" id="stat-month">—</span>
        <span class="stat-tile__label">Sessions this month</span>
      </div>
      <div class="stat-tile">
        <span class="stat-tile__num" id="stat-owed">—</span>
        <span class="stat-tile__label">Payouts owed</span>
      </div>
    </div>

    <p class="state-loading" id="loading">Loading</p>
    <p class="state-empty" id="error" hidden></p>

    <div class="data-table-wrap" id="table-wrap" hidden>
      <table class="data-table" id="mentor-table">
        <thead>
          <tr>
            <th></th>
            <th>Mentor</th>
            <th>Rate</th>
            <th>Mentees</th>
            <th>Sessions</th>
            <th>This month</th>
            <th>Last session</th>
            <th>Next session</th>
            <th>Owed</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="mentor-body"></tbody>
      </table>
    </div>

  </main>

  <script type="module" src="admin.js"></script>

</body>
</html>
