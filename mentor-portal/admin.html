<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <title>Admin – The Headstart</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <link rel="manifest" href="/mentor-portal/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/mentor-portal/icons/icon-180.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Headstart" />
  <meta name="format-detection" content="telephone=no" />
  <script defer src="/mentor-portal/pwa.js"></script>
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
  <style id="auth-gate">
    html:not(.auth-ok) body { visibility: hidden; }
    html:not(.auth-ok) { background: #000; }
    html:not(.auth-ok)::after {
      content: ""; position: fixed; top: 50%; left: 50%;
      width: 30px; height: 30px; margin: -15px 0 0 -15px;
      border-radius: 50%; border: 3px solid rgba(255,255,255,0.18);
      border-top-color: #c79b3b; animation: auth-spin 0.7s linear infinite;
    }
    @keyframes auth-spin { to { transform: rotate(360deg); } }
  </style>
  <script>
    /* Failsafe: if the login check has not finished in 12s (e.g. the auth
       library failed to load on a weak connection) swap the blank screen for
       a reload prompt so nobody is ever stuck on a black screen. */
    setTimeout(function () {
      var r = document.documentElement;
      if (!r.classList.contains("auth-ok")) {
        r.classList.add("auth-ok");
        if (document.body) document.body.innerHTML =
          '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;background:#000;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif">' +
          '<p style="font-size:1.05rem;max-width:340px;line-height:1.5">This page is taking too long to load. Check your internet, then reload.</p>' +
          '<button onclick="location.reload()" style="padding:12px 26px;border-radius:999px;border:1px solid #c79b3b;background:transparent;color:#f0c75c;font-weight:700;font-size:0.9rem;cursor:pointer">Reload</button>' +
          '</div>';
      }
    }, 12000);
  </script>
  <link rel="stylesheet" href="portal.css" />
  <link rel="stylesheet" href="admin.css" />
  <link rel="stylesheet" href="admin-calendar.css" />
  <link rel="stylesheet" href="admin-status.css" />
  <link rel="stylesheet" href="/mentor-portal/polish.css" />
</head>
<body>

  <div id="portal-nav"></div>

  <main class="admin-page">

    <div class="admin-head">
      <h1 class="admin-title">Mentor Overview</h1>
      <div class="admin-tabs" id="admin-tabs">
        <button type="button" class="admin-tab is-active" data-view="mentees">Mentee status</button>
        <button type="button" class="admin-tab" data-view="overview">Overview</button>
        <button type="button" class="admin-tab" data-view="calendar">Calendar</button>
      </div>
    </div>

    <p class="state-loading" id="loading">Loading</p>
    <p class="state-empty" id="error" hidden></p>

    <!-- OVERVIEW -->
    <section id="view-overview" hidden>
      <div class="stat-row">
        <div class="stat-tile">
          <span class="stat-tile__num" id="stat-active">—</span>
          <span class="stat-tile__label">Active mentors (30d)</span>
        </div>
        <div class="stat-tile">
          <span class="stat-tile__num" id="stat-mentees">—</span>
          <span class="stat-tile__label">Acquired mentees</span>
        </div>
        <div class="stat-tile">
          <span class="stat-tile__num" id="stat-month">—</span>
          <span class="stat-tile__label">Sessions this month</span>
        </div>
        <div class="stat-tile">
          <span class="stat-tile__num" id="stat-owed">—</span>
          <span class="stat-tile__label">Payouts owed</span>
        </div>
      </div>

      <div class="data-table-wrap">
        <table class="data-table" id="mentor-table">
          <thead>
            <tr>
              <th></th>
              <th>Mentor</th>
              <th>Rate</th>
              <th>Mentees</th>
              <th>Sessions</th>
              <th>This month</th>
              <th>Last session</th>
              <th>Next session</th>
              <th>Owed</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="mentor-body"></tbody>
        </table>
      </div>
    </section>

    <!-- CALENDAR -->
    <section id="view-calendar" hidden>
      <div class="cal-controls">
        <button type="button" class="cal-btn" id="cal-prev" aria-label="Previous month">&#8249;</button>
        <button type="button" class="cal-btn" id="cal-next" aria-label="Next month">&#8250;</button>
        <button type="button" class="cal-btn cal-btn--today" id="cal-today">Today</button>
        <h2 class="cal-title" id="cal-title"></h2>
        <button type="button" class="cal-btn cal-btn--add" id="cal-add">+ Add session</button>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
      <div class="cal-legend" id="cal-legend"></div>
    </section>

    <!-- Calendar detail / add-session popup -->
    <div class="cal-modal" id="cal-modal" hidden>
      <div class="cal-modal__box">
        <button type="button" class="cal-modal__close" id="cal-modal-close" aria-label="Close">&times;</button>
        <div id="cal-modal-body"></div>
      </div>
    </div>

    <!-- MENTEE STATUS -->
    <section id="view-mentees" hidden>
      <div class="status-grid" id="status-grid"></div>
    </section>

  </main>

  <script type="module" src="admin.js"></script>

</body>
</html>
