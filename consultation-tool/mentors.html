<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Recommended mentors — Headstart</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/mentors.css" />
  <style>
    /* base.css went light when the rest of the consultation tool did. The
       recommendation screens stay dark, so they pin the original tokens back.
       Kept here rather than in base.css so one page's look cannot drift when
       the shared file changes again. */
    :root {
      --bg: #000000;
      --text: #ffffff;
      --accent: #c79b3b;
      --accent-bright: #f0c75c;
      --accent-soft: rgba(199, 155, 59, 0.22);
      --card-bg: rgba(255, 255, 255, 0.02);
      --card-border: rgba(255, 255, 255, 0.08);
    }
    .eyebrow { color: #f7d879; }
    .btn { background: linear-gradient(135deg, rgba(199, 155, 59, 0.18), rgba(0, 0, 0, 0.9)); color: #fff; }
    .btn:hover { border-color: rgba(199, 155, 59, 0.85); box-shadow: 0 0 24px rgba(199, 155, 59, 0.45); }
    .btn--gold {
      border: none; color: #2b1b09;
      background: linear-gradient(135deg, #fdf5c4 0%, #f7d37d 35%, #c08a2d 70%, #ffeb9f 100%);
    }
  </style>
  <link rel="stylesheet" href="/mentor-portal/portal.css" />
  <link rel="stylesheet" href="/mentor-portal/portal-nav.css" />
  <link rel="stylesheet" href="css/chrome.css" />
  <style id="auth-gate">
    html:not(.auth-ok) body { visibility: hidden; }
    html:not(.auth-ok) { background: #000; }
    html:not(.auth-ok)::after {
      content: ""; position: fixed; top: 50%; left: 50%;
      width: 30px; height: 30px; margin: -15px 0 0 -15px;
      border-radius: 50%; border: 3px solid rgba(255,255,255,0.18);
      border-top-color: #c79b3b; animation: auth-spin 0.7s linear infinite;
    }
    @keyframes auth-spin { to { transform: rotate(360deg); } }
  </style>
  <script>
    /* Failsafe: if the login check has not finished in 12s (e.g. the auth
       library failed to load on a weak connection) swap the blank screen for
       a reload prompt so nobody is ever stuck on a black screen. */
    setTimeout(function () {
      var r = document.documentElement;
      if (!r.classList.contains("auth-ok")) {
        r.classList.add("auth-ok");
        if (document.body) document.body.innerHTML =
          '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;background:#000;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif">' +
          '<p style="font-size:1.05rem;max-width:340px;line-height:1.5">This page is taking too long to load. Check your internet, then reload.</p>' +
          '<button onclick="location.reload()" style="padding:12px 26px;border-radius:999px;border:1px solid #c79b3b;background:transparent;color:#f0c75c;font-weight:700;font-size:0.9rem;cursor:pointer">Reload</button>' +
          '</div>';
      }
    }, 12000);
  </script>
  <script type="module">
    import { getSession } from "/mentor-portal/auth.js";
    const OWNERS = ["fidelhon@gmail.com", "kokoro.araki1015@gmail.com"];
    (async () => {
      if (location.hostname === "localhost" || location.hostname === "127.0.0.1") {
        document.documentElement.classList.add("auth-ok"); return;
      }
      const session = await getSession();
      if (!session) { location.replace("/mentor-portal/login.html?next=" + encodeURIComponent(location.pathname)); return; }
      if (!OWNERS.includes((session.user?.email || "").toLowerCase().trim())) {
        location.replace("/mentor-portal/index.html"); return;
      }
      document.documentElement.classList.add("auth-ok");
    })();
  </script>
</head>
<body>
  <div id="portal-nav"></div>

  <main class="shell">
    <div class="mentors-top">
      <header class="page-head">
        <p class="eyebrow">Your match</p>
        <h1 class="page-title">Recommended mentors</h1>
      </header>
      <div class="mentor-search">
        <span class="mentor-search__icon">&#128269;</span>
        <input class="mentor-search__input" id="mentorSearch" type="text"
          placeholder="Search by major, e.g. finance, marketing, data science…"
          autocomplete="off" />
      </div>
    </div>

    <div id="mentorResults"></div>

    <a class="back-link" href="structure.html">&larr; Back to session structure</a>
  </main>

  <footer class="tool-foot">
    <div class="shell">Headstart Mentoring — internal consultation resource.</div>
  </footer>

  <script type="module">const v=new URLSearchParams(location.search).get("v")||"0";await import(`./js/mentors.js?v=${v}`);</script>
  <script type="module">
    import { mountConsultNav } from "./js/chrome.js";
    mountConsultNav("consult-mentors", "dark");
  </script>
</body>
</html>
