<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>ROI — Headstart</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/roi.css" />
  <link rel="stylesheet" href="/mentor-portal/portal.css" />
  <link rel="stylesheet" href="/mentor-portal/portal-nav.css" />
  <link rel="stylesheet" href="css/chrome.css" />
  <style id="auth-gate">
    html:not(.auth-ok) body { visibility: hidden; }
    html:not(.auth-ok) { background: #000; }
    html:not(.auth-ok)::after {
      content: ""; position: fixed; top: 50%; left: 50%;
      width: 30px; height: 30px; margin: -15px 0 0 -15px;
      border-radius: 50%; border: 3px solid rgba(255,255,255,0.18);
      border-top-color: #c79b3b; animation: auth-spin 0.7s linear infinite;
    }
    @keyframes auth-spin { to { transform: rotate(360deg); } }
  </style>
  <script>
    /* Failsafe: if the login check has not finished in 12s (e.g. the auth
       library failed to load on a weak connection) swap the blank screen for
       a reload prompt so nobody is ever stuck on a black screen. */
    setTimeout(function () {
      var r = document.documentElement;
      if (!r.classList.contains("auth-ok")) {
        r.classList.add("auth-ok");
        if (document.body) document.body.innerHTML =
          '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;background:#000;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif">' +
          '<p style="font-size:1.05rem;max-width:340px;line-height:1.5">This page is taking too long to load. Check your internet, then reload.</p>' +
          '<button onclick="location.reload()" style="padding:12px 26px;border-radius:999px;border:1px solid #c79b3b;background:transparent;color:#f0c75c;font-weight:700;font-size:0.9rem;cursor:pointer">Reload</button>' +
          '</div>';
      }
    }, 12000);
  </script>
  <script type="module">
    import { getSession } from "/mentor-portal/auth.js";
    const OWNERS = ["fidelhon@gmail.com", "kokoro.araki1015@gmail.com"];
    (async () => {
      if (location.hostname === "localhost" || location.hostname === "127.0.0.1") {
        document.documentElement.classList.add("auth-ok"); return;
      }
      const session = await getSession();
      if (!session) { location.replace("/mentor-portal/login.html?next=" + encodeURIComponent(location.pathname)); return; }
      if (!OWNERS.includes((session.user?.email || "").toLowerCase().trim())) {
        location.replace("/mentor-portal/index.html"); return;
      }
      document.documentElement.classList.add("auth-ok");
    })();
  </script>
</head>
<body>
  <div id="portal-nav"></div>

  <main class="shell">
    <header class="page-head">
      <h1 class="page-title">Return on mentorship</h1>
    </header>

    <div class="roi-grid">
      <section class="roi-panel">
        <div class="roi-field">
          <div class="roi-field__top">
            <label class="roi-field__label" for="roiSalary">Expected starting salary</label>
            <span class="roi-field__val" id="roiSalaryVal">$70,000</span>
          </div>
          <input class="roi-range" type="range" id="roiSalary" min="45000" max="140000" step="1000" value="70000" />
        </div>

        <div class="roi-field">
          <div class="roi-field__top">
            <label class="roi-field__label" for="roiMonths">Hired sooner with mentorship</label>
            <span class="roi-field__val" id="roiMonthsVal">3 months</span>
          </div>
          <input class="roi-range" type="range" id="roiMonths" min="1" max="6" step="1" value="3" />
        </div>

        <div class="roi-field">
          <div class="roi-field__top">
            <label class="roi-field__label" for="roiSessions">Sessions</label>
            <span class="roi-field__val" id="roiSessionsVal">5 sessions</span>
          </div>
          <input class="roi-range" type="range" id="roiSessions" min="1" max="12" step="1" value="5" />
        </div>
      </section>

      <section class="roi-panel">
        <div class="roi-line">
          <span class="roi-line__label">
            Mentorship investment
            <span class="roi-line__sub" id="roiInvestSub">5 x $49</span>
          </span>
          <span class="roi-line__val roi-line__val--out" id="roiInvestVal">-$245</span>
        </div>
        <div class="roi-line">
          <span class="roi-line__label">
            <span id="roiGainedLabel">Take-home gained (3 months)</span>
            <span class="roi-line__sub">after 18% tax</span>
          </span>
          <span class="roi-line__val roi-line__val--in" id="roiGainedVal">+$14,350</span>
        </div>
        <div class="roi-net">
          <span class="roi-net__label">Net gain</span>
          <span class="roi-net__val" id="roiNetVal">$14,105</span>
        </div>
        <div class="roi-return">
          <span class="roi-return__label">Return</span>
          <span class="roi-return__val" id="roiReturnVal">59x</span>
        </div>
        <p class="roi-note" id="roiNote">Covered after about 2 days of earning.</p>
      </section>
    </div>

    <a class="back-link" href="pricing.html">Pricing &rarr;</a>
  </main>

  <footer class="tool-foot">
    <div class="shell">Headstart Mentoring — internal consultation resource.</div>
  </footer>

  <script src="js/roi.js"></script>
  <script type="module">
    import { mountConsultNav } from "./js/chrome.js";
    mountConsultNav("consult-roi", "dark");
  </script>
</body>
</html>
