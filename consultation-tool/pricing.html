<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Pricing — Headstart</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/pricing.css" />
  <style id="auth-gate">
    html:not(.auth-ok) body { visibility: hidden; }
    html:not(.auth-ok) { background: #000; }
    html:not(.auth-ok)::after {
      content: ""; position: fixed; top: 50%; left: 50%;
      width: 30px; height: 30px; margin: -15px 0 0 -15px;
      border-radius: 50%; border: 3px solid rgba(255,255,255,0.18);
      border-top-color: #c79b3b; animation: auth-spin 0.7s linear infinite;
    }
    @keyframes auth-spin { to { transform: rotate(360deg); } }
  </style>
  <script>
    /* Failsafe: if the login check has not finished in 12s (e.g. the auth
       library failed to load on a weak connection) swap the blank screen for
       a reload prompt so nobody is ever stuck on a black screen. */
    setTimeout(function () {
      var r = document.documentElement;
      if (!r.classList.contains("auth-ok")) {
        r.classList.add("auth-ok");
        if (document.body) document.body.innerHTML =
          '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;background:#000;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif">' +
          '<p style="font-size:1.05rem;max-width:340px;line-height:1.5">This page is taking too long to load. Check your internet, then reload.</p>' +
          '<button onclick="location.reload()" style="padding:12px 26px;border-radius:999px;border:1px solid #c79b3b;background:transparent;color:#f0c75c;font-weight:700;font-size:0.9rem;cursor:pointer">Reload</button>' +
          '</div>';
      }
    }, 12000);
  </script>
  <script type="module">
    import { getSession } from "/mentor-portal/auth.js";
    const OWNERS = ["fidelhon@gmail.com", "kokoro.araki1015@gmail.com"];
    (async () => {
      if (location.hostname === "localhost" || location.hostname === "127.0.0.1") {
        document.documentElement.classList.add("auth-ok"); return;
      }
      const session = await getSession();
      if (!session) { location.replace("/mentor-portal/login.html?next=" + encodeURIComponent(location.pathname)); return; }
      if (!OWNERS.includes((session.user?.email || "").toLowerCase().trim())) {
        location.replace("/mentor-portal/index.html"); return;
      }
      document.documentElement.classList.add("auth-ok");
    })();
  </script>
</head>
<body>
  <nav class="tool-nav">
    <div class="tool-nav__inner">
      <a class="tool-nav__brand" href="index.html"><img src="../images/headstart-italic-logo.png" alt="Headstart" class="tool-nav__logo" style="height:70px;width:auto;display:block;" /></a>
      <a class="tool-nav__link" href="/mentor-portal/index.html" style="opacity:0.55;">← Portal</a>
      <a class="tool-nav__link" href="index.html">Notes</a>
      <a class="tool-nav__link" href="matrix.html">Where you are</a>
      <a class="tool-nav__link" href="structure.html">Session structure</a>
      <a class="tool-nav__link" href="mentors.html">Mentors</a>
      <a class="tool-nav__link" href="roi.html">ROI</a>
      <a class="tool-nav__link is-current" href="pricing.html">Pricing</a>
      <button class="tool-nav__live" onclick="location.href=location.pathname+'?v='+Date.now()"><span class="tool-nav__live__icon">&#8635;</span> Live</button>
    </div>
  </nav>

  <main class="shell">
    <header class="page-head">
      <h1 class="page-title">Pricing</h1>
    </header>

    <div class="pricing-grid">
      <div class="pricing-box">
        <span class="pricing-box__eyebrow">Pay as you go</span>
        <h3 class="pricing-box__title">Single Session</h3>
        <div class="pricing-box__price">
          <span class="pricing-box__amount">$55</span>
          <span class="pricing-box__unit">/session</span>
        </div>
        <div class="pricing-box__calc"></div>
      </div>

      <div class="pricing-box">
        <span class="pricing-box__eyebrow">Best value</span>
        <h3 class="pricing-box__title">5-Session Prepay</h3>
        <div class="pricing-box__price">
          <span class="pricing-box__amount">$245</span>
          <span class="pricing-box__unit">for 5 sessions</span>
        </div>
        <div class="pricing-box__calc">$245 &divide; 5 = $49/session</div>
      </div>
    </div>

    <a class="back-link" href="mentors.html">&larr; Back to mentors</a>
  </main>

  <footer class="tool-foot">
    <div class="shell">Headstart Mentoring — internal consultation resource.</div>
  </footer>

  <script>// Propagate ?v= to all nav links so every navigation is cache-fresh
(function(){var v=new URLSearchParams(location.search).get("v");if(!v)return;document.querySelectorAll(".tool-nav__link").forEach(function(a){var u=new URL(a.href,location.href);u.searchParams.set("v",v);a.href=u.pathname+"?v="+v;});})();
</script>
</body>
</html>
