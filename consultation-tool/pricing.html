<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Pricing — Headstart</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/pricing.css" />
</head>
<body>
  <nav class="tool-nav">
    <div class="tool-nav__inner">
      <a class="tool-nav__brand" href="index.html"><img src="../images/headstart-italic-logo.png" alt="Headstart" class="tool-nav__logo" style="height:70px;width:auto;display:block;" /></a>
      <a class="tool-nav__link" href="index.html">Where you are</a>
      <a class="tool-nav__link" href="structure.html">Session structure</a>
      <a class="tool-nav__link" href="mentors.html">Mentors</a>
      <a class="tool-nav__link is-current" href="pricing.html">Pricing</a>
      <button class="tool-nav__live" onclick="location.href=location.pathname+'?v='+Date.now()"><span class="tool-nav__live__icon">&#8635;</span> Live</button>
    </div>
  </nav>

  <main class="shell">
    <header class="page-head">
      <h1 class="page-title">Pricing</h1>
    </header>

    <div class="pricing-grid">
      <div class="pricing-box">
        <span class="pricing-box__eyebrow">Pay as you go</span>
        <h3 class="pricing-box__title">Single Session</h3>
        <div class="pricing-box__price">
          <span class="pricing-box__amount">$35</span>
          <span class="pricing-box__unit">/session</span>
        </div>
      </div>

      <div class="pricing-box">
        <span class="pricing-box__eyebrow">Best value</span>
        <h3 class="pricing-box__title">5+ Session Block</h3>
        <div class="pricing-box__price">
          <span class="pricing-box__amount">$30</span>
          <span class="pricing-box__unit">/session</span>
        </div>
      </div>
    </div>

    <a class="back-link" href="mentors.html">&larr; Back to mentors</a>
  </main>

  <footer class="tool-foot">
    <div class="shell">Headstart Mentoring — internal consultation resource.</div>
  </footer>

  <script>// Propagate ?v= to all nav links so every navigation is cache-fresh
(function(){var v=new URLSearchParams(location.search).get("v");if(!v)return;document.querySelectorAll(".tool-nav__link").forEach(function(a){var u=new URL(a.href,location.href);u.searchParams.set("v",v);a.href=u.pathname+"?v="+v;});})();
</script>
</body>
</html>
