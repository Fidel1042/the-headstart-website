<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Headstart Mentoring</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Career mentors for international students in Australia." />
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
  <link rel="icon" href="images/website-logo.png" />
  <link rel="apple-touch-icon" href="images/website-logo.png" />

  <meta property="og:title" content="Headstart Mentoring" />
  <meta property="og:description" content="Career mentors for international students in Australia." />
  <meta property="og:image" content="images/website-logo.png" />
  <meta property="og:type" content="website" />

  <!-- Google tag (gtag.js) -->
  <script src="/js/attribution.js"></script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-SMH2KVMJT2"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag("js", new Date());
    gtag("config", "G-SMH2KVMJT2", window.HS_ATTRIBUTION_CONFIG || {});
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <style>
    :root {
      --bg: #000000;
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.55);
      --gold-1: #f3d27a;
      --gold-2: #d9a94a;
      --gold-3: #a87923;
      --gold-grad: linear-gradient(135deg, var(--gold-1) 0%, var(--gold-2) 50%, var(--gold-3) 100%);
      --card: rgba(255, 255, 255, 0.04);
      --card-hover: rgba(255, 255, 255, 0.08);
      --border: rgba(255, 255, 255, 0.1);
      --border-gold: rgba(217, 169, 74, 0.55);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      position: relative;
      -webkit-font-smoothing: antialiased;
    }

    #silk-bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .bg-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      background:
        radial-gradient(circle at 50% 0%, rgba(243, 210, 122, 0.18), transparent 55%),
        radial-gradient(circle at 80% 100%, rgba(168, 121, 35, 0.12), transparent 50%);
      opacity: 0;
    }

    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 3;
      opacity: 0;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    }

    .wrap {
      position: relative;
      z-index: 10;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 40px 24px 40px;
      max-width: 440px;
      margin: 0 auto;
    }

    .brand-logo {
      width: auto;
      height: 100px;
      max-width: 100%;
      margin-bottom: 8px;
      opacity: 0;
      mix-blend-mode: screen;
      filter: drop-shadow(0 2px 14px rgba(243, 210, 122, 0.25));
    }

    .brand-tagline {
      font-size: 12px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--muted);
      text-align: center;
      margin-bottom: 36px;
      opacity: 0;
    }

    .cta-stack {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .cta {
      position: relative;
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      padding: 18px 20px;
      border-radius: 18px;
      background: rgba(10, 10, 10, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text);
      text-decoration: none;
      overflow: hidden;
      transition: background 0.25s ease, border-color 0.25s ease;
      opacity: 0;
      transform: translateY(60px) scale(0.9);
      cursor: pointer;
      will-change: transform;
    }

    .cta::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 30%, rgba(243, 210, 122, 0.22) 50%, transparent 70%);
      transform: translateX(-100%);
      transition: transform 0.7s ease;
      pointer-events: none;
    }

    .cta:hover, .cta:active {
      background: rgba(22, 22, 22, 0.92);
      border-color: var(--border-gold);
    }
    .cta:hover::before, .cta:active::before {
      transform: translateX(100%);
    }

    .cta-icon {
      flex: 0 0 44px;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--gold-grad);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0a0a0a;
      box-shadow: 0 6px 18px rgba(217, 169, 74, 0.25);
    }
    .cta-icon svg { width: 22px; height: 22px; }

    .cta-body { flex: 1; min-width: 0; }
    .cta-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
      line-height: 1.3;
      margin-bottom: 3px;
    }
    .cta-sub {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.35;
    }

    .cta-arrow {
      flex: 0 0 auto;
      color: var(--muted);
      transition: transform 0.25s ease;
    }
    .cta:hover .cta-arrow, .cta:active .cta-arrow {
      transform: translateX(4px);
    }
    .cta-arrow svg { display: block; }

    .cta--gold {
      background: rgba(14, 11, 4, 0.90);
      border-color: rgba(199, 155, 59, 0.35);
    }
    .cta--gold:hover, .cta--gold:active {
      background: rgba(20, 15, 5, 0.93);
      border-color: rgba(199, 155, 59, 0.65);
    }
    .cta--gold .cta-title {
      color: #f7d37d;
    }
    .cta--gold .cta-icon {
      background: rgba(199, 155, 59, 0.12);
      box-shadow: none;
      color: #f3d27a;
    }

@media (max-width: 360px) {
      .cta-title { font-size: 13.5px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.001s !important;
        transition-duration: 0.001s !important;
      }
    }
  </style>
</head>
<body>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="arrowStroke" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#f3d27a" />
        <stop offset="100%" stop-color="#a87923" />
      </linearGradient>
      <filter id="filter-noise-x">
        <feTurbulence id="turbX" type="fractalNoise" baseFrequency="0.000001" numOctaves="1" />
        <feDisplacementMap in="SourceGraphic" scale="40" />
      </filter>
      <filter id="filter-noise-y">
        <feTurbulence id="turbY" type="fractalNoise" baseFrequency="0.000001" numOctaves="1" />
        <feDisplacementMap in="SourceGraphic" scale="40" />
      </filter>
    </defs>
  </svg>
  <div id="ch-h" style="position:fixed;top:0;left:0;width:100%;height:1px;background:rgba(255,255,255,0.18);pointer-events:none;z-index:9998;opacity:0;"></div>
  <div id="ch-v" style="position:fixed;top:0;left:0;height:100%;width:1px;background:rgba(255,255,255,0.18);pointer-events:none;z-index:9998;opacity:0;"></div>

  <canvas id="silk-bg"></canvas>
  <div class="bg-glow"></div>
  <div class="grain"></div>

  <main class="wrap">
    <img class="brand-logo" src="images/headstart-italic-logo.png" alt="Headstart Mentoring" />
    <p class="brand-tagline" style="color:#fff;">Career mentors for international students</p>

    <div class="cta-stack">

      <a class="cta" href="/" data-cta data-track="mentoring_landing">
        <div class="cta-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
            <path d="M16 3.13a4 4 0 0 1 0 7.75" />
          </svg>
        </div>
        <div class="cta-body">
          <div class="cta-title">Want to land a Grad Role?</div>
        </div>
        <span class="cta-arrow">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M5 12H19M19 12L13 6M19 12L13 18" stroke="url(#arrowStroke)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </span>
      </a>

      <a class="cta" href="/job-alerts" data-cta data-track="job_alerts">
        <div class="cta-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 16v-5a6 6 0 0 0-4-5.66V4a2 2 0 1 0-4 0v1.34A6 6 0 0 0 6 11v5l-2 2h16l-2-2z" />
            <path d="M10 22a2 2 0 0 0 4 0" />
          </svg>
        </div>
        <div class="cta-body">
          <div class="cta-title">Job Alerts</div>
          <div class="cta-sub">Weekly Jobs Open for International Students, filtered by major</div>
        </div>
        <span class="cta-arrow">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M5 12H19M19 12L13 6M19 12L13 18" stroke="url(#arrowStroke)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </span>
      </a>

      <a class="cta" href="https://www.linkedin.com/in/fidel-hon-353b4326a" target="_blank" rel="noopener" data-cta data-track="linkedin_tips">
        <div class="cta-icon">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14zM8.34 9.5H5.67V18h2.67V9.5zM7 6.11a1.55 1.55 0 1 0 0 3.1 1.55 1.55 0 0 0 0-3.1zM18.34 18v-4.66c0-2.48-1.32-3.63-3.09-3.63-1.42 0-2.06.78-2.42 1.33V9.5h-2.66V18h2.66v-4.42c0-.23.02-.47.09-.63.19-.47.62-.95 1.34-.95.95 0 1.32.72 1.32 1.77V18h2.66z" />
          </svg>
        </div>
        <div class="cta-body">
          <div class="cta-title">Practical Job Search Tips</div>
        </div>
        <span class="cta-arrow">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M5 12H19M19 12L13 6M19 12L13 18" stroke="url(#arrowStroke)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </span>
      </a>

    </div>
  </main>

  <script>
    (function () {
      var canvas = document.getElementById('silk-bg');
      var gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
      if (!gl) return;

      var vert = [
        'attribute vec2 aPos;',
        'varying vec2 vUv;',
        'void main(){',
        '  vUv = aPos * 0.5 + 0.5;',
        '  gl_Position = vec4(aPos, 0.0, 1.0);',
        '}'
      ].join('\n');

      var frag = [
        'precision mediump float;',
        'varying vec2 vUv;',
        'uniform float uTime;',
        'uniform vec3  uColor;',
        'uniform float uSpeed;',
        'uniform float uScale;',
        'uniform float uRotation;',
        'uniform float uNoiseIntensity;',
        'const float e = 2.71828182845904523536;',
        'float noise(vec2 tc){',
        '  float G=e;',
        '  vec2 r=(G*sin(G*tc));',
        '  return fract(r.x*r.y*(1.0+tc.x));',
        '}',
        'vec2 rotateUvs(vec2 uv,float angle){',
        '  float c=cos(angle); float s=sin(angle);',
        '  mat2 rot=mat2(c,-s,s,c);',
        '  return rot*uv;',
        '}',
        'void main(){',
        '  float rnd=noise(gl_FragCoord.xy);',
        '  vec2 uv=rotateUvs(vUv*uScale,uRotation);',
        '  vec2 tex=uv*uScale;',
        '  float tOffset=uSpeed*uTime;',
        '  tex.y+=0.03*sin(8.0*tex.x-tOffset);',
        '  float pattern=0.6+0.4*sin(5.0*(tex.x+tex.y+cos(3.0*tex.x+5.0*tex.y)+0.02*tOffset)+sin(20.0*(tex.x+tex.y-0.1*tOffset)));',
        '  vec4 col=vec4(uColor,1.0)*vec4(pattern)-rnd/15.0*uNoiseIntensity;',
        '  col.a=1.0;',
        '  gl_FragColor=col;',
        '}'
      ].join('\n');

      function makeShader(type, src) {
        var sh = gl.createShader(type);
        gl.shaderSource(sh, src);
        gl.compileShader(sh);
        return sh;
      }

      var prog = gl.createProgram();
      gl.attachShader(prog, makeShader(gl.VERTEX_SHADER, vert));
      gl.attachShader(prog, makeShader(gl.FRAGMENT_SHADER, frag));
      gl.linkProgram(prog);
      gl.useProgram(prog);

      var buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
      var aPos = gl.getAttribLocation(prog, 'aPos');
      gl.enableVertexAttribArray(aPos);
      gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

      var uTime     = gl.getUniformLocation(prog, 'uTime');
      var uColor    = gl.getUniformLocation(prog, 'uColor');
      var uSpeed    = gl.getUniformLocation(prog, 'uSpeed');
      var uScale    = gl.getUniformLocation(prog, 'uScale');
      var uRotation = gl.getUniformLocation(prog, 'uRotation');
      var uNoise    = gl.getUniformLocation(prog, 'uNoiseIntensity');

      function hexRgb(hex) {
        hex = hex.replace('#','');
        return [parseInt(hex.slice(0,2),16)/255, parseInt(hex.slice(2,4),16)/255, parseInt(hex.slice(4,6),16)/255];
      }
      // Softened 1 Sep 2026. The silk was competing with the buttons: this
      // colour is what sets the pattern's contrast against the black page, so
      // darkening it is the single biggest lever on how loud the texture reads.
      // The motion and shape are unchanged, only the strength.
      var rgb = hexRgb('#332F36');
      gl.uniform3f(uColor, rgb[0], rgb[1], rgb[2]);
      gl.uniform1f(uSpeed, 5);
      gl.uniform1f(uScale, 1);
      gl.uniform1f(uRotation, 0);
      gl.uniform1f(uNoise, 0.8);

      function resize() {
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width  = window.innerWidth  * dpr;
        canvas.height = window.innerHeight * dpr;
        canvas.style.width  = window.innerWidth  + 'px';
        canvas.style.height = window.innerHeight + 'px';
        gl.viewport(0, 0, canvas.width, canvas.height);
      }
      resize();
      window.addEventListener('resize', resize);

      var t = 0, last = null;
      function loop(ts) {
        if (last !== null) t += 0.1 * (ts - last) / 1000;
        last = ts;
        gl.uniform1f(uTime, t);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    })();
  </script>

  <script>
    window.addEventListener('load', () => {
      gsap.to('.bg-glow', { opacity: 1, duration: 1.5, ease: 'power2.out' });
      gsap.to('.grain',   { opacity: 0.025, duration: 1.5, ease: 'power2.out' });

      gsap.fromTo('.brand-logo',
        { opacity: 0, filter: 'blur(18px)' },
        { opacity: 1, filter: 'blur(0px)', duration: 1.0, ease: 'power3.out' }
      );
      gsap.fromTo('.brand-tagline',
        { opacity: 0, filter: 'blur(10px)' },
        { opacity: 1, filter: 'blur(0px)', duration: 0.9, delay: 0.25, ease: 'power3.out' }
      );

      gsap.fromTo('.cta',
        { opacity: 0, y: 40, scale: 0.95, filter: 'blur(12px)' },
        {
          opacity: 1, y: 0, scale: 1, filter: 'blur(0px)',
          duration: 0.7,
          stagger: 0.18,
          delay: 0.4,
          ease: 'power3.out',
        }
      );
    });

    // 3D tilt on desktop (hover-capable) devices only
    var canHover = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
    if (canHover) {
      document.querySelectorAll('[data-cta]').forEach((btn) => {
        btn.addEventListener('pointermove', (e) => {
          const rect = btn.getBoundingClientRect();
          const x = ((e.clientX - rect.left) / rect.width  - 0.5) * 6;
          const y = ((e.clientY - rect.top)  / rect.height - 0.5) * 6;
          gsap.to(btn, { rotateY: x, rotateX: -y, duration: 0.4, ease: 'power2.out', transformPerspective: 800 });
        });
        btn.addEventListener('pointerleave', () => {
          gsap.to(btn, { rotateY: 0, rotateX: 0, duration: 0.5, ease: 'power3.out' });
        });
      });
    }

    // GA4 link click tracking. The visitor's real source comes from
    // attribution.js, so /links works for Instagram bio, stories, WhatsApp,
    // or anywhere else it gets posted.
    document.querySelectorAll('[data-track]').forEach((btn) => {
      btn.addEventListener('click', () => {
        if (typeof window.hsTrack === 'function') {
          window.hsTrack('link_click', {
            link_id: btn.dataset.track,
            link_url: btn.href
          });
        }
      });
    });

    // Crosshair cursor (desktop only)
    if (canHover) {
      (function () {
        var lineH   = document.getElementById('ch-h');
        var lineV   = document.getElementById('ch-v');
        var turbX   = document.getElementById('turbX');
        var turbY   = document.getElementById('turbY');
        var mouse   = { x: 0, y: 0 };
        var state   = { tx: { prev: 0, cur: 0, amt: 0.15 }, ty: { prev: 0, cur: 0, amt: 0.15 } };
        var started = false;

        var lerp = function (a, b, n) { return (1 - n) * a + n * b; };

        var render = function () {
          state.tx.cur = mouse.x;
          state.ty.cur = mouse.y;
          state.tx.prev = lerp(state.tx.prev, state.tx.cur, state.tx.amt);
          state.ty.prev = lerp(state.ty.prev, state.ty.cur, state.ty.amt);
          gsap.set(lineV, { x: state.tx.prev });
          gsap.set(lineH, { y: state.ty.prev });
          requestAnimationFrame(render);
        };

        var primitiveValues = { turbulence: 0 };
        var glitchTl = gsap.timeline({
          paused: true,
          onStart: function () {
            lineH.style.filter = 'url(#filter-noise-x)';
            lineV.style.filter = 'url(#filter-noise-y)';
          },
          onUpdate: function () {
            if (turbX) turbX.setAttribute('baseFrequency', primitiveValues.turbulence);
            if (turbY) turbY.setAttribute('baseFrequency', primitiveValues.turbulence);
          },
          onComplete: function () {
            lineH.style.filter = 'none';
            lineV.style.filter = 'none';
          }
        }).to(primitiveValues, { duration: 0.5, ease: 'power1.out', startAt: { turbulence: 1 }, turbulence: 0 });

        window.addEventListener('mousemove', function (e) {
          mouse.x = e.clientX;
          mouse.y = e.clientY;
          if (!started) {
            started = true;
            state.tx.prev = state.tx.cur = mouse.x;
            state.ty.prev = state.ty.cur = mouse.y;
            gsap.to([lineH, lineV], { duration: 0.9, ease: 'power3.out', opacity: 1 });
            render();
          }
        });

        document.querySelectorAll('a').forEach(function (link) {
          link.addEventListener('mouseenter', function () { glitchTl.restart(); });
          link.addEventListener('mouseleave', function () { glitchTl.progress(1).kill(); });
        });
      })();
    }

    // Tap press feel on all devices
    document.querySelectorAll('[data-cta]').forEach((btn) => {
      btn.addEventListener('pointerdown', () => {
        gsap.to(btn, { scale: 0.97, duration: 0.12, ease: 'power2.out' });
      });
      btn.addEventListener('pointerup', () => {
        gsap.to(btn, { scale: 1, duration: 0.2, ease: 'power2.out' });
      });
      btn.addEventListener('pointercancel', () => {
        gsap.to(btn, { scale: 1, duration: 0.2, ease: 'power2.out' });
      });
    });
  </script>
</body>
</html>
