<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Headstart — Mobile Preview (Digital Twin)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --bg: #0a0a0a;
      --panel: #141414;
      --panel-2: #1c1c1c;
      --border: rgba(255,255,255,0.08);
      --border-strong: rgba(199,155,59,0.4);
      --text: #ffffff;
      --muted: #9a9a9a;
      --gold: #f7d37d;
      --gold-dark: #c08a2d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      grid-template-columns: 280px 1fr;
      grid-template-rows: auto 1fr;
      grid-template-areas:
        "topbar topbar"
        "sidebar stage";
    }

    .topbar {
      grid-area: topbar;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 0.85rem 1.4rem;
      display: flex;
      align-items: center;
      gap: 1.2rem;
      flex-wrap: wrap;
    }

    .topbar h1 {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .topbar h1 small {
      display: inline-block;
      font-weight: 500;
      font-size: 0.74rem;
      color: var(--muted);
      margin-left: 0.4rem;
      letter-spacing: 0;
    }

    .size-switch {
      display: flex;
      gap: 0.4rem;
      margin-left: auto;
    }

    .size-btn {
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.45rem 0.85rem;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }

    .size-btn:hover { border-color: var(--border-strong); }
    .size-btn.is-active {
      background: linear-gradient(135deg, #fff0a0 0%, #f0c030 50%, #b87800 100%);
      color: #0d0d0d;
      border-color: transparent;
    }

    .live-toggle {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.45rem 0.85rem;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: border-color 0.15s;
    }

    .live-toggle:hover { border-color: var(--border-strong); }
    .live-toggle.is-on { border-color: rgba(86,200,120,0.6); color: #b9f0c8; }
    .live-toggle__dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4a4a4a;
      transition: background 0.15s;
    }
    .live-toggle.is-on .live-toggle__dot {
      background: #5ac878;
      box-shadow: 0 0 0 4px rgba(90,200,120,0.18);
      animation: liveDotPulse 1.6s ease-in-out infinite;
    }
    @keyframes liveDotPulse {
      0%, 100% { box-shadow: 0 0 0 3px rgba(90,200,120,0.18); }
      50%      { box-shadow: 0 0 0 6px rgba(90,200,120,0.05); }
    }

    .reload-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 0.45rem 0.7rem;
      border-radius: 999px;
      font-size: 0.78rem;
      cursor: pointer;
      font-family: inherit;
      transition: color 0.15s, border-color 0.15s;
    }
    .reload-btn:hover { color: var(--text); border-color: var(--border-strong); }

    .open-tab {
      background: transparent;
      border: 1px solid var(--border-strong);
      color: var(--gold);
      padding: 0.45rem 0.9rem;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      text-decoration: none;
      transition: background 0.15s;
    }

    .open-tab:hover { background: rgba(199,155,59,0.1); }

    /* ── Sidebar ── */
    .sidebar {
      grid-area: sidebar;
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 1.1rem 0.85rem 2rem;
      overflow-y: auto;
      max-height: calc(100vh - 60px);
    }

    .sidebar-search {
      width: 100%;
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.55rem 0.8rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-family: inherit;
      margin-bottom: 0.9rem;
      outline: none;
    }

    .sidebar-search:focus { border-color: var(--border-strong); }

    .sidebar-group {
      margin-bottom: 1.1rem;
    }

    .sidebar-group__title {
      font-size: 0.66rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--gold-dark);
      padding: 0 0.6rem;
      margin-bottom: 0.45rem;
    }

    .sidebar-item {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      color: var(--text);
      padding: 0.5rem 0.7rem;
      border-radius: 7px;
      font-size: 0.85rem;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .sidebar-item:hover { background: rgba(255,255,255,0.04); }

    .sidebar-item.is-active {
      background: rgba(199,155,59,0.12);
      color: var(--gold);
      font-weight: 600;
    }

    .sidebar-item.is-hidden { display: none; }

    /* ── Stage / phone frame ── */
    .stage {
      grid-area: stage;
      padding: 1.5rem;
      overflow-y: auto;
      max-height: calc(100vh - 60px);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background:
        radial-gradient(circle at 50% 0%, rgba(199,155,59,0.05), transparent 60%),
        var(--bg);
    }

    .phone {
      position: relative;
      width: 375px;
      height: 812px;
      transition: transform 0.25s ease;
      transform-origin: top center;
      flex-shrink: 0;
    }

    .phone[data-size="mobile-sm"]  { width: 320px;  height: 700px;  }
    .phone[data-size="mobile"]     { width: 375px;  height: 812px;  }
    .phone[data-size="mobile-lg"]  { width: 414px;  height: 896px;  }
    .phone[data-size="tablet"]     { width: 768px;  height: 1024px; }
    .phone[data-size="desktop"]    { width: 1280px; height: 800px;  }
    .phone[data-size="desktop-lg"] { width: 1440px; height: 900px;  }

    .phone__bezel {
      position: absolute;
      inset: 0;
      background: #1a1a1a;
      border-radius: 36px;
      padding: 14px;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.06),
        0 30px 60px -20px rgba(0,0,0,0.9);
    }

    .phone[data-size="tablet"] .phone__bezel { border-radius: 20px; padding: 12px; }
    .phone[data-size="desktop"] .phone__bezel { border-radius: 14px; padding: 10px; }

    .phone__screen {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
      border-radius: 24px;
      overflow: hidden;
    }

    .phone[data-size="tablet"] .phone__screen,
    .phone[data-size="desktop"] .phone__screen { border-radius: 10px; }

    .phone__iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
      display: block;
    }

    .phone__caption {
      text-align: center;
      margin-top: 0.85rem;
      font-size: 0.78rem;
      color: var(--muted);
      letter-spacing: 0.06em;
    }

    .phone__caption strong {
      color: var(--text);
      font-weight: 600;
      margin-right: 0.6rem;
    }

    /* ── Compare mode: mobile + tablet + desktop side by side ── */
    .compare-grid {
      display: none;
      gap: 1.5rem;
      align-items: flex-start;
      justify-content: center;
      width: 100%;
      flex-wrap: nowrap;
    }
    body.is-compare .compare-grid { display: flex; }
    body.is-compare > main.stage > .phone { display: none; }
    body.is-compare .size-switch { display: none; }
    .compare-grid .phone { margin: 0; }

    /* ── Responsive: small screens ── */
    @media (max-width: 900px) {
      body {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto 1fr;
        grid-template-areas:
          "topbar"
          "sidebar"
          "stage";
      }

      .sidebar {
        max-height: 220px;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }

      .stage { max-height: none; padding: 1rem; }
    }
  </style>
</head>

  <script>
    const phone = document.getElementById('phone');
    const frame = document.getElementById('phoneFrame');
    const label = document.getElementById('phoneLabel');
    const sizeReadout = document.getElementById('phoneSize');
    const openTab = document.getElementById('openTab');
    const search = document.getElementById('sidebarSearch');
    const stage = document.querySelector('.stage');

    const PHONE_SIZES = {
      'mobile-sm':  { w: 320,  h: 700  },
      'mobile':     { w: 375,  h: 812  },
      'mobile-lg':  { w: 414,  h: 896  },
      'tablet':     { w: 768,  h: 1024 },
      'desktop':    { w: 1280, h: 800  },
      'desktop-lg': { w: 1440, h: 900  }
    };

    // Cache-bust query string so the iframe always pulls the latest file
    function cacheBust(src) {
      const sep = src.includes('?') ? '&' : '?';
      return src + sep + '_t=' + Date.now();
    }

    let currentSrc = 'index.html';

    function setSrc(src, lbl) {
      currentSrc = src;
      frame.src = cacheBust(src);
      openTab.href = src;
      label.textContent = lbl;
      // Sync compare iframes
      document.querySelectorAll('[data-compare]').forEach(f => {
        f.src = cacheBust(src);
      });
      try {
        history.replaceState(null, '', '#' + encodeURIComponent(src));
      } catch (_) {}
    }

    function reloadIframe() {
      // Preserve scroll position
      let scrollY = 0;
      try { scrollY = frame.contentWindow.scrollY || 0; } catch (_) {}
      frame.src = cacheBust(currentSrc);
      frame.addEventListener('load', function once() {
        frame.removeEventListener('load', once);
        try { frame.contentWindow.scrollTo(0, scrollY); } catch (_) {}
      });
    }

    // Chrome keeps an aggressive in-memory CSS cache that even no-cache
    // headers can't always defeat. Force-refresh every <link> stylesheet
    // inside the iframe whenever it loads — appending a unique timestamp
    // makes Chrome re-fetch from the server.
    function bustChildStylesheetsFor(iframeEl) {
      try {
        const doc = iframeEl.contentDocument;
        if (!doc) return;
        const stamp = Date.now();
        doc.querySelectorAll('link[rel="stylesheet"]').forEach(link => {
          try {
            const u = new URL(link.href);
            u.searchParams.set('_css', stamp);
            link.href = u.toString();
          } catch (_) {}
        });
      } catch (_) {}
    }
    frame.addEventListener('load', () => bustChildStylesheetsFor(frame));
    document.querySelectorAll('[data-compare]').forEach(f => {
      f.addEventListener('load', () => bustChildStylesheetsFor(f));
    });

    function fitPhoneToStage() {
      const target = PHONE_SIZES[phone.dataset.size] || PHONE_SIZES['mobile'];
      // Reset transform before measuring
      phone.style.transform = '';
      phone.style.marginBottom = '';
      const stageRect = stage.getBoundingClientRect();
      const availW = Math.max(160, stageRect.width  - 48);
      const availH = Math.max(220, stageRect.height - 120);
      const scaleW = availW / target.w;
      const scaleH = availH / target.h;
      const scale = Math.min(1, scaleW, scaleH);
      if (scale < 1) {
        phone.style.transform = 'scale(' + scale.toFixed(3) + ')';
        // Compensate so caption + scrollable area aren't pushed down by the un-scaled box height
        phone.style.marginBottom = '-' + Math.round(target.h * (1 - scale)) + 'px';
      }
      sizeReadout.textContent = target.w + ' × ' + target.h
        + (scale < 1 ? ' · ' + Math.round(scale * 100) + '%' : '');
    }

    function fitCompareGrid() {
      const phones = document.querySelectorAll('.compare-grid .phone');
      if (!phones.length) return;
      const stageRect = stage.getBoundingClientRect();
      const gapPx = 24 * (phones.length - 1);
      const slotW = Math.max(140, (stageRect.width - 48 - gapPx) / phones.length);
      const availH = Math.max(260, stageRect.height - 140);
      phones.forEach(p => {
        const target = PHONE_SIZES[p.dataset.size];
        if (!target) return;
        p.style.transform = '';
        p.style.marginBottom = '';
        const scale = Math.min(1, slotW / target.w, availH / target.h);
        if (scale < 1) {
          p.style.transform = 'scale(' + scale.toFixed(3) + ')';
          p.style.marginBottom = '-' + Math.round(target.h * (1 - scale)) + 'px';
        }
      });
    }

    function setSize(size) {
      phone.dataset.size = size;
      document.querySelectorAll('.size-btn').forEach(b => {
        b.classList.toggle('is-active', b.dataset.size === size);
      });
      fitPhoneToStage();
    }

    // Sidebar item click
    document.querySelectorAll('.sidebar-item').forEach(item => {
      item.addEventListener('click', () => {
        document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('is-active'));
        item.classList.add('is-active');
        setSrc(item.dataset.src, item.dataset.label);
      });
    });

    // Size button click
    document.querySelectorAll('.size-btn').forEach(btn => {
      btn.addEventListener('click', () => setSize(btn.dataset.size));
    });

    // Sidebar search filter
    search.addEventListener('input', () => {
      const q = search.value.trim().toLowerCase();
      document.querySelectorAll('.sidebar-item').forEach(item => {
        const txt = (item.dataset.label + ' ' + item.dataset.src).toLowerCase();
        item.classList.toggle('is-hidden', q && !txt.includes(q));
      });
      // Hide empty groups
      document.querySelectorAll('.sidebar-group').forEach(group => {
        const anyVisible = Array.from(group.querySelectorAll('.sidebar-item'))
          .some(i => !i.classList.contains('is-hidden'));
        group.style.display = anyVisible ? '' : 'none';
      });
    });

    // Restore from hash on load
    (function restore() {
      const hash = decodeURIComponent((location.hash || '').slice(1));
      if (!hash) { setSize('mobile'); return; }
      const match = Array.from(document.querySelectorAll('.sidebar-item'))
        .find(i => i.dataset.src === hash);
      if (match) {
        document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('is-active'));
        match.classList.add('is-active');
        setSrc(match.dataset.src, match.dataset.label);
      }
      setSize('mobile');
    })();

    // Recompute fit + readout after transitions / resize
    let resizeTimer;
    function refit() {
      fitPhoneToStage();
      if (document.body.classList.contains('is-compare')) fitCompareGrid();
    }
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(refit, 80);
    });
    // Initial fit once layout settles
    requestAnimationFrame(refit);

    // ── Compare mode toggle ──
    const compareBtn = document.getElementById('compareBtn');
    compareBtn.addEventListener('click', () => {
      const isOn = document.body.classList.toggle('is-compare');
      compareBtn.classList.toggle('is-active', isOn);
      compareBtn.textContent = isOn ? 'Single view' : 'Compare all';
      if (isOn) {
        // Load all three compare iframes with the current page
        document.querySelectorAll('[data-compare]').forEach(f => {
          f.src = cacheBust(currentSrc);
        });
        requestAnimationFrame(fitCompareGrid);
      } else {
        requestAnimationFrame(fitPhoneToStage);
      }
    });

    // ── Manual reload button ──
    const reloadBtn = document.getElementById('reloadBtn');
    reloadBtn.addEventListener('click', reloadIframe);

    // ── Live auto-refresh: polls iframe HTML + style.css and any @import'd CSS
    //     every 2s; if any Last-Modified changes, force-reload the iframe. ──
    const liveToggle = document.getElementById('liveToggle');
    let liveOn = true;
    let lastMod = {};
    let watchedCss = ['style.css'];
    let pollLock = false;

    async function discoverCssFiles() {
      const list = new Set(['style.css']);
      try {
        const res = await fetch('style.css?_t=' + Date.now(), { cache: 'no-store' });
        const text = await res.text();
        const re = /@import\s+url\(["']?([^"')]+)["']?\)/g;
        let m;
        while ((m = re.exec(text)) !== null) {
          let p = m[1].trim();
          if (p.startsWith('http')) continue;
          p = p.replace(/^\.?\//, '');
          list.add(p);
        }
      } catch (_) {}
      watchedCss = Array.from(list);
    }

    async function checkLastModified(path) {
      try {
        const res = await fetch(path + '?_t=' + Date.now(), { method: 'HEAD', cache: 'no-store' });
        return res.headers.get('Last-Modified') || null;
      } catch (_) { return null; }
    }

    async function pollChanges() {
      if (!liveOn || pollLock) return;
      pollLock = true;
      try {
        // Resolve iframe path (strip cache-bust)
        const u = new URL(frame.src, location.href);
        const htmlPath = u.pathname.replace(/^\//, '') || 'index.html';

        const paths = [htmlPath, ...watchedCss];
        let changed = false;

        for (const p of paths) {
          const lm = await checkLastModified(p);
          if (!lm) continue;
          if (lastMod[p] && lm !== lastMod[p]) changed = true;
          lastMod[p] = lm;
        }

        if (changed) reloadIframe();
      } finally {
        pollLock = false;
      }
    }

    liveToggle.addEventListener('click', () => {
      liveOn = !liveOn;
      liveToggle.classList.toggle('is-on', liveOn);
    });

    // Discover CSS imports after iframe loads, then start polling
    frame.addEventListener('load', () => { discoverCssFiles(); });
    discoverCssFiles();
    setInterval(pollChanges, 2000);
  </script>
</body>
</html>
